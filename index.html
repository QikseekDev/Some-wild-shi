<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Obamify</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #404040;
    color: #eee;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: default;
}

/* ============================================================
   CONTROLS
   ============================================================ */

#controls {
    position: fixed;
    z-index: 20;

    top: 8px;
    left: 50%;
    transform: translateX(-50%);

    width: min(760px, calc(100vw - 16px));

    padding: 6px;

    background: rgba(48, 48, 48, .96);

    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 4px;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, .45),
        0 8px 24px rgba(0, 0, 0, .2);

    font-size: 13px;

    user-select: none;
    -webkit-user-select: none;
}

.row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 30px;
}

.row + .row {
    margin-top: 5px;
}

button,
select,
input {
    font: inherit;
}

button,
select {
    color: #eee;
    background: #555;
    border: 1px solid #707070;
    border-radius: 3px;
}

button {
    min-height: 27px;
    padding: 3px 9px;
    cursor: pointer;
}

button:hover {
    background: #626262;
}

button:active {
    background: #444;
}

button:disabled {
    opacity: .5;
    cursor: default;
}

button.active {
    background: #777;
    border-color: #aaa;
}

select {
    min-height: 27px;
    padding: 2px 7px;
}

input[type="number"] {
    width: 65px;
    min-height: 27px;

    padding: 3px 6px;

    color: white;
    background: #444;

    border: 1px solid #707070;
    border-radius: 3px;
}

input[type="range"] {
    width: 130px;
    accent-color: #aaa;
}

.spacer {
    flex: 1;
}

.label {
    color: #ccc;
    white-space: nowrap;
}

.value {
    width: 38px;
    text-align: right;
    color: #aaa;
    font-variant-numeric: tabular-nums;
}

/* ============================================================
   IMAGE BUTTONS
   ============================================================ */

.image-button {
    display: flex;
    align-items: center;
    gap: 6px;
}

.image-button img {
    width: 27px;
    height: 27px;
    object-fit: cover;
    border-radius: 2px;
    background: #222;
}

/* ============================================================
   ADVANCED
   ============================================================ */

#advanced {
    display: none;
    margin-top: 5px;
    padding-top: 5px;
    border-top: 1px solid rgba(255,255,255,.08);
}

#advanced.open {
    display: block;
}

#advanced .row {
    justify-content: flex-start;
}

/* ============================================================
   DRAW CONTROLS
   ============================================================ */

#drawControls {
    display: none;
}

#drawControls.open {
    display: flex;
}

#brushSize {
    width: 90px;
}

#brushColor {
    width: 30px;
    height: 27px;
    padding: 1px;
    border: 1px solid #707070;
    background: #444;
    cursor: pointer;
}

#drawStatus {
    color: #aaa;
    white-space: nowrap;
}

/* ============================================================
   CROP
   ============================================================ */

#cropOverlay {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.75);
}

#cropOverlay.open {
    display: flex;
}

#cropBox {
    width: min(700px, calc(100vw - 24px));

    padding: 12px;

    background: #3e3e3e;

    border: 1px solid #777;
    border-radius: 5px;

    box-shadow:
        0 10px 50px rgba(0,0,0,.6);
}

#cropTitle {
    margin-bottom: 10px;
    font-weight: 600;
}

#cropPreview {
    width: 100%;
    height: min(55vh, 500px);

    display: flex;
    align-items: center;
    justify-content: center;

    background: #222;
    overflow: hidden;
}

#cropCanvas {
    max-width: 100%;
    max-height: 100%;
}

.crop-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 9px;
}

.crop-row span {
    width: 80px;
}

.crop-row input {
    flex: 1;
}

.crop-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 10px;
}

/* ============================================================
   LINKS
   ============================================================ */

#links {
    position: fixed;
    z-index: 20;

    left: 18px;
    bottom: 18px;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.link {
    width: 45px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    border-radius: 8px;

    text-decoration: none;

    transition:
        transform .15s;
}

.link:hover {
    transform: scale(1.08);
}

.link svg {
    width: 29px;
    height: 29px;
    fill: white;
}

/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 600px) {

    #controls {
        top: 4px;
        width: calc(100vw - 8px);
        font-size: 12px;
    }

    .row {
        flex-wrap: wrap;
    }

    input[type="range"] {
        width: 105px;
    }

    #links {
        left: 12px;
        bottom: 12px;
    }

    #drawStatus {
        display: none;
    }
}
</style>

<script>
"use strict";

/* ============================================================
   ELEMENTS
   ============================================================ */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false
    });

const sourceFile =
    document.getElementById("sourceFile");

const targetFile =
    document.getElementById("targetFile");

const sourcePreview =
    document.getElementById("sourcePreview");

const targetPreview =
    document.getElementById("targetPreview");

const resolutionInput =
    document.getElementById("resolution");

const proximityInput =
    document.getElementById("proximity");

const proximityValue =
    document.getElementById("proximityValue");

const algorithmInput =
    document.getElementById("algorithm");

const drawButton =
    document.getElementById("drawButton");

const drawControls =
    document.getElementById("drawControls");

const brushSize =
    document.getElementById("brushSize");

const brushSizeValue =
    document.getElementById("brushSizeValue");

const brushColor =
    document.getElementById("brushColor");

const clearDrawing =
    document.getElementById("clearDrawing");

/* ============================================================
   STATE
   ============================================================ */

let sourceImage = null;
let targetImage = null;

let sourceCanvas = null;
let targetCanvas = null;

let particles = [];

let playing = false;

let progress = 0;

let animationStart = 0;

let animationFrame = null;

let cropMode = null;
let cropImage = null;

let drawMode = false;
let drawing = false;

let lastDrawX = null;
let lastDrawY = null;

/*
 * Separate 512x512 canvas containing the user's drawing.
 *
 * This is deliberately kept separate from the original
 * source canvas so the source image itself is not destroyed.
 */
const drawingCanvas =
    document.createElement("canvas");

drawingCanvas.width = 512;
drawingCanvas.height = 512;

const drawingCtx =
    drawingCanvas.getContext("2d", {
        willReadFrequently: true
    });

drawingCtx.clearRect(
    0,
    0,
    512,
    512
);

/* ============================================================
   DEFAULT SOURCE
   ============================================================ */

function createDefaultSource() {

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 512;

    const x =
        c.getContext("2d");

    const gradient =
        x.createLinearGradient(
            0,
            0,
            512,
            512
        );

    gradient.addColorStop(
        0,
        "#888"
    );

    gradient.addColorStop(
        1,
        "#222"
    );

    x.fillStyle =
        gradient;

    x.fillRect(
        0,
        0,
        512,
        512
    );

    return c;
}

/* ============================================================
   FALLBACK TARGET
   ============================================================ */

function createFallbackObama() {

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 512;

    const x =
        c.getContext("2d");

    x.fillStyle =
        "#27354b";

    x.fillRect(
        0,
        0,
        512,
        512
    );

    x.fillStyle =
        "#c9946b";

    x.beginPath();

    x.ellipse(
        256,
        240,
        105,
        130,
        0,
        0,
        Math.PI * 2
    );

    x.fill();

    x.fillStyle =
        "#17120f";

    x.beginPath();

    x.ellipse(
        256,
        145,
        108,
        65,
        Math.PI,
        0,
        Math.PI * 2
    );

    x.fill();

    x.fillStyle =
        "#111";

    x.beginPath();

    x.ellipse(
        215,
        240,
        13,
        8,
        0,
        0,
        Math.PI * 2
    );

    x.ellipse(
        297,
        240,
        13,
        8,
        0,
        0,
        Math.PI * 2
    );

    x.fill();

    x.strokeStyle =
        "#633c2c";

    x.lineWidth =
        5;

    x.beginPath();

    x.arc(
        256,
        275,
        43,
        .2,
        Math.PI - .2
    );

    x.stroke();

    x.fillStyle =
        "#111";

    x.beginPath();

    x.moveTo(150, 355);
    x.lineTo(362, 355);
    x.lineTo(430, 512);
    x.lineTo(82, 512);

    x.closePath();

    x.fill();

    return c;
}

/* ============================================================
   IMAGE LOADING
   ============================================================ */

function loadFile(file) {

    return new Promise((resolve, reject) => {

        if (
            !file ||
            !file.type.startsWith("image/")
        ) {

            reject(
                new Error(
                    "Invalid image"
                )
            );

            return;
        }

        const url =
            URL.createObjectURL(file);

        const img =
            new Image();

        img.onload = () => {

            URL.revokeObjectURL(
                url
            );

            resolve(img);
        };

        img.onerror = () => {

            URL.revokeObjectURL(
                url
            );

            reject(
                new Error(
                    "Could not load image"
                )
            );
        };

        img.src =
            url;
    });
}

function loadURL(url) {

    return new Promise((resolve, reject) => {

        const img =
            new Image();

        img.crossOrigin =
            "anonymous";

        img.onload = () =>
            resolve(img);

        img.onerror = () =>
            reject(
                new Error(
                    "Could not load image"
                )
            );

        img.src =
            url;
    });
}

/* ============================================================
   SQUARE CROP
   ============================================================ */

function makeSquare(
    img,
    offsetX = .5,
    offsetY = .5,
    zoom = 1
) {

    const width =
        img.naturalWidth ||
        img.width;

    const height =
        img.naturalHeight ||
        img.height;

    const side =
        Math.min(
            width,
            height
        );

    const visible =
        side / zoom;

    const maxX =
        width - visible;

    const maxY =
        height - visible;

    const sx =
        maxX * offsetX;

    const sy =
        maxY * offsetY;

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 512;

    const x =
        c.getContext("2d");

    x.imageSmoothingEnabled =
        true;

    x.drawImage(
        img,
        sx,
        sy,
        visible,
        visible,
        0,
        0,
        512,
        512
    );

    return c;
}

/* ============================================================
   PREVIEW
   ============================================================ */

function updatePreview(
    canvasElement,
    previewElement
) {

    previewElement.src =
        canvasElement.toDataURL(
            "image/jpeg",
            .85
        );
}

/* ============================================================
   RESIZE
   ============================================================ */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(
            innerWidth * dpr
        );

    canvas.height =
        Math.round(
            innerHeight * dpr
        );

    canvas.style.width =
        innerWidth + "px";

    canvas.style.height =
        innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();
}

window.addEventListener(
    "resize",
    resizeCanvas,
    {
        passive: true
    }
);

/* ============================================================
   COLOR DISTANCE
   ============================================================ */

function colorDistance(a, b) {

    const dr =
        a.r - b.r;

    const dg =
        a.g - b.g;

    const db =
        a.b - b.b;

    return (
        dr * dr +
        dg * dg +
        db * db
    );
}

/* ============================================================
   BUILD PIXELS
   ============================================================ */

function buildPixels() {

    if (
        !sourceCanvas ||
        !targetCanvas
    )
        return;

    const requested =
        Number(
            resolutionInput.value
        );

    const resolution =
        Math.max(
            8,
            Math.min(
                160,
                Number.isFinite(requested)
                    ? Math.floor(requested)
                    : 64
            )
        );

    resolutionInput.value =
        resolution;

    const sourceData =
        sourceCanvas
            .getContext("2d", {
                willReadFrequently: true
            })
            .getImageData(
                0,
                0,
                512,
                512
            ).data;

    const targetData =
        targetCanvas
            .getContext("2d", {
                willReadFrequently: true
            })
            .getImageData(
                0,
                0,
                512,
                512
            ).data;

    const step =
        512 / resolution;

    const source =
        [];

    const target =
        [];

    /*
     * Sample both images at exactly the same
     * grid positions.
     */

    for (
        let y = 0;
        y < resolution;
        y++
    ) {

        for (
            let x = 0;
            x < resolution;
            x++
        ) {

            const px =
                Math.min(
                    511,
                    Math.floor(
                        (x + .5) * step
                    )
                );

            const py =
                Math.min(
                    511,
                    Math.floor(
                        (y + .5) * step
                    )
                );

            const index =
                (
                    py * 512 +
                    px
                ) * 4;

            source.push({

                x: x + .5,
                y: y + .5,

                r:
                    sourceData[index],

                g:
                    sourceData[index + 1],

                b:
                    sourceData[index + 2]
            });

            target.push({

                x: x + .5,
                y: y + .5,

                r:
                    targetData[index],

                g:
                    targetData[index + 1],

                b:
                    targetData[index + 2]
            });
        }
    }

    const proximity =
        Number(
            proximityInput.value
        );

    /*
     * Instead of copying target colors into particles,
     * target pixels ONLY determine destinations.
     */

    const sortedSource =
        source
            .map(
                (pixel, index) => ({
                    pixel,
                    index,

                    brightness:
                        (
                            pixel.r +
                            pixel.g +
                            pixel.b
                        ) / 3
                })
            )
            .sort(
                (a, b) =>
                    a.brightness -
                    b.brightness
            );

    const sortedTarget =
        target
            .map(
                (pixel, index) => ({
                    pixel,
                    index,

                    brightness:
                        (
                            pixel.r +
                            pixel.g +
                            pixel.b
                        ) / 3
                })
            )
            .sort(
                (a, b) =>
                    a.brightness -
                    b.brightness
            );

    const assignments =
        new Array(
            source.length
        );

    for (
        let i = 0;
        i < sortedSource.length;
        i++
    ) {

        const sourceEntry =
            sortedSource[i];

        const targetEntry =
            sortedTarget[i];

        assignments[
            sourceEntry.index
        ] =
            targetEntry.pixel;
    }

    /*
     * A full optimal search at high resolutions is
     * extremely expensive. The fast/optimal modes therefore
     * use bounded candidate searches.
     */

    const candidatesPerPixel =
        algorithmInput.value === "fast"
            ? 16
            : Math.min(
                100,
                target.length
            );

    /*
     * Cache brightness ordering rather than sorting the
     * entire target array for every source pixel.
     */

    for (
        let i = 0;
        i < source.length;
        i++
    ) {

        const p =
            source[i];

        let best =
            assignments[i];

        let bestScore =
            Infinity;

        const targetBrightness =
            (
                p.r +
                p.g +
                p.b
            ) / 3;

        /*
         * Find the closest brightness range using binary
         * search, then inspect candidates around it.
         */

        let lo = 0;
        let hi = sortedTarget.length;

        while (lo < hi) {

            const mid =
                (lo + hi) >> 1;

            if (
                sortedTarget[mid].brightness <
                targetBrightness
            ) {

                lo =
                    mid + 1;

            } else {

                hi =
                    mid;
            }
        }

        const half =
            Math.floor(
                candidatesPerPixel / 2
            );

        const start =
            Math.max(
                0,
                lo - half
            );

        const end =
            Math.min(
                sortedTarget.length,
                start +
                candidatesPerPixel
            );

        for (
            let j = start;
            j < end;
            j++
        ) {

            const q =
                sortedTarget[j].pixel;

            const distance =
                colorDistance(
                    p,
                    q
                );

            const dx =
                p.x - q.x;

            const dy =
                p.y - q.y;

            const spatial =
                dx * dx +
                dy * dy;

            const score =
                distance +
                spatial *
                proximity *
                80;

            if (
                score <
                bestScore
            ) {

                bestScore =
                    score;

                best =
                    q;
            }
        }

        assignments[i] =
            best;
    }

    /*
     * Resolve duplicate destinations.
     */

    const used =
        new Set();

    const result =
        [];

    for (
        let i = 0;
        i < source.length;
        i++
    ) {

        const p =
            source[i];

        let destination =
            assignments[i];

        let key =
            destination.x +
            ":" +
            destination.y;

        if (
            used.has(key)
        ) {

            let replacement =
                null;

            let replacementScore =
                Infinity;

            for (
                const q of target
            ) {

                const qKey =
                    q.x +
                    ":" +
                    q.y;

                if (
                    used.has(qKey)
                )
                    continue;

                const dx =
                    p.x - q.x;

                const dy =
                    p.y - q.y;

                const spatial =
                    dx * dx +
                    dy * dy;

                const score =
                    colorDistance(
                        p,
                        q
                    ) +
                    spatial *
                    proximity *
                    80;

                if (
                    score <
                    replacementScore
                ) {

                    replacementScore =
                        score;

                    replacement =
                        q;
                }
            }

            if (replacement)
                destination =
                    replacement;

            key =
                destination.x +
                ":" +
                destination.y;
        }

        used.add(key);

        result.push({

            ox:
                p.x,

            oy:
                p.y,

            tx:
                destination.x,

            ty:
                destination.y,

            /*
             * The source color is stored permanently.
             */

            r:
                p.r,

            g:
                p.g,

            b:
                p.b
        });
    }

    particles =
        result;

    /*
     * Drawing may have changed the source image since the
     * previous build, so immediately refresh the particle
     * colors from the current source.
     */
    refreshParticleColors();
}

/* ============================================================
   REFRESH PARTICLE COLORS
   ============================================================ */

function refreshParticleColors() {

    if (
        !particles.length ||
        !sourceCanvas
    )
        return;

    const resolution =
        Math.max(
            8,
            Math.min(
                160,
                Number(
                    resolutionInput.value
                ) || 64
            )
        );

    const sourceData =
        sourceCanvas
            .getContext("2d", {
                willReadFrequently: true
            })
            .getImageData(
                0,
                0,
                512,
                512
            ).data;

    const step =
        512 / resolution;

    /*
     * Add the drawing layer on top of the source
     * before sampling it.
     */

    const combined =
        document.createElement("canvas");

    combined.width =
        512;

    combined.height =
        512;

    const combinedCtx =
        combined.getContext("2d");

    combinedCtx.drawImage(
        sourceCanvas,
        0,
        0
    );

    combinedCtx.drawImage(
        drawingCanvas,
        0,
        0
    );

    const data =
        combinedCtx
            .getImageData(
                0,
                0,
                512,
                512
            ).data;

    for (
        const particle of particles
    ) {

        const px =
            Math.min(
                511,
                Math.max(
                    0,
                    Math.floor(
                        (particle.ox - .5) *
                        step +
                        step / 2
                    )
                )
            );

        const py =
            Math.min(
                511,
                Math.max(
                    0,
                    Math.floor(
                        (particle.oy - .5) *
                        step +
                        step / 2
                    )
                )
            );

        const index =
            (
                py * 512 +
                px
            ) * 4;

        particle.r =
            data[index];

        particle.g =
            data[index + 1];

        particle.b =
            data[index + 2];
    }

    void sourceData;
}

/* ============================================================
   EASING
   ============================================================ */

function ease(t) {

    return t < .5
        ? 4 * t * t * t
        : 1 -
          Math.pow(
              -2 * t + 2,
              3
          ) / 2;
}

/* ============================================================
   DRAW
   ============================================================ */

function draw(
    animationProgress = progress
) {

    const width =
        innerWidth;

    const height =
        innerHeight;

    ctx.fillStyle =
        "#404040";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    if (!sourceCanvas)
        return;

    const size =
        Math.min(
            width,
            height
        ) * .86;

    const left =
        (width - size) / 2;

    const top =
        (height - size) / 2;

    /*
     * No generated particle map yet.
     * Show the source image plus live drawing.
     */

    if (!particles.length) {

        ctx.imageSmoothingEnabled =
            true;

        ctx.drawImage(
            sourceCanvas,
            left,
            top,
            size,
            size
        );

        if (
            drawingCanvas
        ) {

            ctx.drawImage(
                drawingCanvas,
                left,
                top,
                size,
                size
            );
        }

        return;
    }

    const resolution =
        Math.max(
            8,
            Math.min(
                160,
                Number(
                    resolutionInput.value
                ) || 64
            )
        );

    const cell =
        size / resolution;

    const e =
        ease(
            Math.max(
                0,
                Math.min(
                    1,
                    animationProgress
                )
            )
        );

    /*
     * Every particle keeps its source color.
     *
     * Only X/Y change during animation.
     */

    for (
        const particle of particles
    ) {

        const x =
            particle.ox +
            (
                particle.tx -
                particle.ox
            ) * e;

        const y =
            particle.oy +
            (
                particle.ty -
                particle.oy
            ) * e;

        ctx.fillStyle =
            `rgb(
                ${particle.r},
                ${particle.g},
                ${particle.b}
            )`;

        ctx.fillRect(
            left +
            x * cell,

            top +
            y * cell,

            cell + 1,
            cell + 1
        );
    }

    /*
     * In draw mode, show the brush cursor.
     */

    if (
        drawMode &&
        lastDrawX !== null &&
        lastDrawY !== null
    ) {

        const brush =
            Number(
                brushSize.value
            );

        ctx.beginPath();

        ctx.arc(
            left +
            lastDrawX / 512 * size,

            top +
            lastDrawY / 512 * size,

            brush * size / 512,

            0,
            Math.PI * 2
        );

        ctx.strokeStyle =
            "rgba(255,255,255,.7)";

        ctx.lineWidth =
            1;

        ctx.stroke();
    }
}

/* ============================================================
   ANIMATION
   ============================================================ */

function animationLoop(time) {

    if (!playing)
        return;

    const duration =
        5000;

    progress =
        Math.min(
            1,
            (
                time -
                animationStart
            ) / duration
        );

    draw(progress);

    if (
        progress >= 1
    ) {

        playing =
            false;

        document
            .getElementById("play")
            .textContent =
                "▶";

        animationFrame =
            null;

        return;
    }

    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}

function startAnimation() {

    if (!particles.length)
        buildPixels();

    if (animationFrame)
        cancelAnimationFrame(
            animationFrame
        );

    progress =
        0;

    playing =
        true;

    animationStart =
        performance.now();

    document
        .getElementById("play")
        .textContent =
            "Ⅱ";

    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}

function reset() {

    playing =
        false;

    if (animationFrame)
        cancelAnimationFrame(
            animationFrame
        );

    animationFrame =
        null;

    progress =
        0;

    document
        .getElementById("play")
        .textContent =
            "▶";

    draw();
}

/* ============================================================
   DRAWING MODE
   ============================================================ */

function setDrawMode(enabled) {

    drawMode =
        enabled;

    drawControls
        .classList
        .toggle(
            "open",
            enabled
        );

    drawButton
        .classList
        .toggle(
            "active",
            enabled
        );

    drawButton.textContent =
        enabled
            ? "drawing"
            : "draw";

    canvas.style.cursor =
        enabled
            ? "crosshair"
            : "default";

    if (!enabled) {

        drawing =
            false;

        lastDrawX =
            null;

        lastDrawY =
            null;
    }

    draw();
}

drawButton.addEventListener(
    "click",
    () => {

        setDrawMode(
            !drawMode
        );
    }
);

/* ============================================================
   DRAW COORDINATES
   ============================================================ */

function getImageCoordinates(event) {

    const rect =
        canvas.getBoundingClientRect();

    const size =
        Math.min(
            innerWidth,
            innerHeight
        ) * .86;

    const left =
        (innerWidth - size) / 2;

    const top =
        (innerHeight - size) / 2;

    const clientX =
        event.clientX;

    const clientY =
        event.clientY;

    const x =
        (
            clientX -
            left
        ) / size * 512;

    const y =
        (
            clientY -
            top
        ) / size * 512;

    if (
        x < 0 ||
        x > 512 ||
        y < 0 ||
        y > 512
    )
        return null;

    return {
        x,
        y
    };
}

/* ============================================================
   ACTUAL DRAWING
   ============================================================ */

function drawAt(
    x,
    y
) {

    const size =
        Math.max(
            1,
            Number(
                brushSize.value
            ) || 3
        );

    /*
     * Small hard-edged brush.
     *
     * This writes actual RGB values into the drawing
     * layer instead of changing the target image.
     */

    drawingCtx.fillStyle =
        brushColor.value;

    drawingCtx.beginPath();

    drawingCtx.arc(
        x,
        y,
        size,
        0,
        Math.PI * 2
    );

    drawingCtx.fill();

    /*
     * If particles already exist, update their colors
     * immediately.
     *
     * This is what makes drawing realtime.
     */

    if (particles.length) {

        refreshParticleColors();

        /*
         * Keep the currently generated destination
         * mapping. Only the source particle colors change.
         *
         * Since draw() runs immediately, the changed
         * pixels visibly move along the existing map.
         */

        draw(progress);
    } else {

        draw();
    }
}

/* ============================================================
   DRAW BETWEEN TWO POINTS
   ============================================================ */

function drawLine(
    x1,
    y1,
    x2,
    y2
) {

    const distance =
        Math.hypot(
            x2 - x1,
            y2 - y1
        );

    /*
     * Small spacing prevents gaps when pointer events
     * arrive farther apart than the brush radius.
     */

    const spacing =
        Math.max(
            .75,
            Number(
                brushSize.value
            ) * .45
        );

    const steps =
        Math.max(
            1,
            Math.ceil(
                distance / spacing
            )
        );

    for (
        let i = 1;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;

        drawAt(
            x1 +
            (x2 - x1) * t,

            y1 +
            (y2 - y1) * t
        );
    }
}

/* ============================================================
   POINTER EVENTS
   ============================================================ */

canvas.addEventListener(
    "pointerdown",
    event => {

        if (!drawMode)
            return;

        const point =
            getImageCoordinates(
                event
            );

        if (!point)
            return;

        event.preventDefault();

        drawing =
            true;

        lastDrawX =
            point.x;

        lastDrawY =
            point.y;

        try {

            canvas.setPointerCapture(
                event.pointerId
            );

        } catch {}

        drawAt(
            point.x,
            point.y
        );
    }
);

canvas.addEventListener(
    "pointermove",
    event => {

        if (!drawMode)
            return;

        const point =
            getImageCoordinates(
                event
            );

        if (!point)
            return;

        /*
         * Always update cursor position even when not drawing.
         */

        lastDrawX =
            point.x;

        lastDrawY =
            point.y;

        if (!drawing) {

            draw();
            return;
        }

        event.preventDefault();

        if (
            lastDrawX !== null &&
            lastDrawY !== null
        ) {

            /*
             * These are the previous values before the
             * current point gets stored.
             */
        }

        /*
         * Use a separate previous point so interpolation
         * does not lose the starting coordinate.
         */

        const previousX =
            canvas._lastDrawX;

        const previousY =
            canvas._lastDrawY;

        if (
            Number.isFinite(previousX) &&
            Number.isFinite(previousY)
        ) {

            drawLine(
                previousX,
                previousY,
                point.x,
                point.y
            );

        } else {

            drawAt(
                point.x,
                point.y
            );
        }

        canvas._lastDrawX =
            point.x;

        canvas._lastDrawY =
            point.y;
    }
);

canvas.addEventListener(
    "pointerup",
    event => {

        drawing =
            false;

        canvas._lastDrawX =
            null;

        canvas._lastDrawY =
            null;

        try {

            canvas.releasePointerCapture(
                event.pointerId
            );

        } catch {}
    }
);

canvas.addEventListener(
    "pointercancel",
    event => {

        drawing =
            false;

        canvas._lastDrawX =
            null;

        canvas._lastDrawY =
            null;

        try {

            canvas.releasePointerCapture(
                event.pointerId
            );

        } catch {}
    }
);

canvas.addEventListener(
    "pointerleave",
    () => {

        if (!drawing) {

            lastDrawX =
                null;

            lastDrawY =
                null;

            draw();
        }
    }
);

/* ============================================================
   CROP
   ============================================================ */

const cropOverlay =
    document.getElementById(
        "cropOverlay"
    );

const cropCanvas =
    document.getElementById(
        "cropCanvas"
    );

const cropCtx =
    cropCanvas.getContext(
        "2d"
    );

function openCrop(mode) {

    cropMode =
        mode;

    cropImage =
        mode === "source"
            ? sourceImage
            : targetImage;

    if (
        !cropImage &&
        mode === "source"
    ) {

        cropImage =
            sourceCanvas;
    }

    if (
        !cropImage &&
        mode === "target"
    ) {

        cropImage =
            targetCanvas;
    }

    if (!cropImage)
        return;

    document
        .getElementById("cropX")
        .value = 50;

    document
        .getElementById("cropY")
        .value = 50;

    document
        .getElementById("cropZoom")
        .value = 1;

    cropOverlay
        .classList
        .add("open");

    updateCropPreview();
}

function updateCropPreview() {

    if (!cropImage)
        return;

    const x =
        Number(
            document
                .getElementById("cropX")
                .value
        ) / 100;

    const y =
        Number(
            document
                .getElementById("cropY")
                .value
        ) / 100;

    const zoom =
        Number(
            document
                .getElementById("cropZoom")
                .value
        );

    const image =
        makeSquare(
            cropImage,
            x,
            y,
            zoom
        );

    cropCanvas.width =
        512;

    cropCanvas.height =
        512;

    cropCtx.clearRect(
        0,
        0,
        512,
        512
    );

    cropCtx.drawImage(
        image,
        0,
        0
    );
}

document
    .getElementById("sourceCrop")
    .addEventListener(
        "click",
        () =>
            openCrop("source")
    );

document
    .getElementById("targetCrop")
    .addEventListener(
        "click",
        () =>
            openCrop("target")
    );

for (
    const id
    of [
        "cropX",
        "cropY",
        "cropZoom"
    ]
) {

    document
        .getElementById(id)
        .addEventListener(
            "input",
            updateCropPreview
        );
}

document
    .getElementById("cropCancel")
    .addEventListener(

                .classList

        }

document

            if (!cropImage)
                return;

            const x =
                Number(

                        .getElementById(
                            "cropX"
                        )
                        .value
                ) / 100;

            const y =
                Number(
                    document
                        .getElementById(
                            "cropY"
                        )
                        .value
                ) / 100;

            const zoom =
                Number(
                    document
                        .getElementById(
                            "cropZoom"
                        )
                        .value
                );

            const cropped =
                makeSquare(
                    cropImage,
                    x,
                    y,
                    zoom
                );

            if (
                cropMode ===
                "source"
            ) {

                sourceCanvas =
                    cropped;

                sourcePreview.src =
                    cropped.toDataURL();

                drawingCtx.clearRect(
                    0,
                    0,
                    512,
                    512
                );

            } else {

                targetCanvas =
                    cropped;

                targetPreview.src =
                    cropped.toDataURL();
            }

            particles = [];

            cropOverlay
                .classList
                .remove("open");

            reset();
        }
    );

/* ============================================================

   ============================================================ */

document
    .getElementById("save")
    .addEventListener(
        "click",
        async () => {

            if (!particles.length)
                buildPixels();

            if (
                !canvas.captureStream ||
                !window.MediaRecorder
            ) {

                alert(
                    "Animation export is not supported by this browser."
                );

                return;
            }

            const stream =
                canvas.captureStream(
                    30
                );

            let mime =
                "video/webm";

            if (
                MediaRecorder
                    .isTypeSupported(
                        "video/webm;codecs=vp9"
                    )
            ) {

                mime =
                    "video/webm;codecs=vp9";
            }

            const recorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType: mime
                    }
                );

            const chunks =
                [];

            recorder.ondataavailable =
                event => {

                    if (
                        event.data.size
                    ) {

                        chunks.push(
                            event.data
                        );
                    }
                };

            recorder.onstop =
                () => {

                    const blob =
                        new Blob(
                            chunks,
                            {
                                type: mime
                            }
                        );

                    const url =
                        URL.createObjectURL(
                            blob
                        );

                    const a =
                        document.createElement(
                            "a"
                        );

                    a.href =
                        url;

                    a.download =
                        "obamify.webm";

                    document
                        .body
                        .appendChild(a);

                    a.click();

                    a.remove();

                    setTimeout(
                        () =>
                            URL.revokeObjectURL(
                                url
                            ),
                        1000
                    );
                };

            recorder.start();

            const start =
                performance.now();

            function record(time) {

                const p =
                    Math.min(
                        1,
                        (
                            time -
                            start
                        ) / 5000
                    );

                draw(p);

                if (
                    p < 1
                ) {

                    requestAnimationFrame(
                        record
                    );

                } else {

                    setTimeout(
                        () =>
                            recorder.stop(),
                        100
                    );
                }
            }

            requestAnimationFrame(
                record
            );
        }
    );

/* ============================================================
   INITIALIZATION
   ============================================================ */

async function init() {

    sourceCanvas =
        createDefaultSource();

    sourcePreview.src =
        sourceCanvas.toDataURL();

    try {

        targetImage =
            await loadURL(
                "https://raw.githubusercontent.com/Spu7Nix/obamify/main/assets/obama.png"
            );

        targetCanvas =
            makeSquare(
                targetImage
            );

    } catch {

        targetCanvas =
            createFallbackObama();
    }

    targetPreview.src =
        targetCanvas.toDataURL();

    resizeCanvas();
}

init();

</script>
