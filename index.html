<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Obamify</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #404040;
    color: #eee;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}

#controls {
    position: fixed;
    z-index: 20;

    top: 8px;
    left: 50%;
    transform: translateX(-50%);

    width: min(900px, calc(100vw - 16px));

    padding: 6px;

    background: rgba(48, 48, 48, .96);

    border: 1px solid rgba(255,255,255,.12);
    border-radius: 4px;

    box-shadow:
        0 2px 8px rgba(0,0,0,.45),
        0 8px 24px rgba(0,0,0,.2);

    font-size: 13px;

    user-select: none;
    -webkit-user-select: none;
}

.row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 30px;
}

.row + .row {
    margin-top: 5px;
}

button,
select,
input {
    font: inherit;
}

button,
select {
    color: #eee;
    background: #555;
    border: 1px solid #707070;
    border-radius: 3px;
}

button {
    min-height: 27px;
    padding: 3px 9px;
    cursor: pointer;
}

button:hover {
    background: #626262;
}

button:active {
    background: #444;
}

button:disabled {
    opacity: .5;
    cursor: default;
}

select {
    min-height: 27px;
    padding: 2px 7px;
}

input[type="number"] {
    width: 65px;
    min-height: 27px;

    padding: 3px 6px;

    color: white;
    background: #444;

    border: 1px solid #707070;
    border-radius: 3px;
}

input[type="range"] {
    width: 130px;
    accent-color: #aaa;
}

input[type="color"] {
    width: 34px;
    height: 27px;
    padding: 1px;
    border: 1px solid #707070;
    background: #444;
    border-radius: 3px;
}

.spacer {
    flex: 1;
}

.label {
    color: #ccc;
    white-space: nowrap;
}

.value {
    width: 42px;
    text-align: right;
    color: #aaa;
    font-variant-numeric: tabular-nums;
}

.image-button {
    display: flex;
    align-items: center;
    gap: 6px;
}

.image-button img {
    width: 27px;
    height: 27px;
    object-fit: cover;
    border-radius: 2px;
    background: #222;
}

#advanced {
    display: none;

    margin-top: 5px;
    padding-top: 5px;

    border-top: 1px solid rgba(255,255,255,.08);
}

#advanced.open {
    display: block;
}

#drawControls {
    display: none;
}

#drawControls.open {
    display: block;
}

#progressContainer {
    width: 100%;
    height: 6px;

    margin-top: 6px;

    background: #282828;
    border-radius: 3px;
    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;

    background: #aaa;

    transition: width .05s linear;
}

#status {
    color: #aaa;
    font-size: 11px;
    white-space: nowrap;
}

#brushCursor {
    position: fixed;

    z-index: 90;

    display: none;

    pointer-events: none;

    border: 1px solid rgba(255,255,255,.8);
    border-radius: 50%;

    transform: translate(-50%, -50%);
}

#links {
    position: fixed;
    z-index: 20;

    left: 18px;
    bottom: 18px;

    display: flex;
    flex-direction: column;

    gap: 10px;
}

.link {
    width: 45px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    border-radius: 8px;

    text-decoration: none;

    transition: transform .15s;
}

.link:hover {
    transform: scale(1.08);
}

.link svg {
    width: 29px;
    height: 29px;
    fill: white;
}

#cropOverlay {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.75);
}

#cropOverlay.open {
    display: flex;
}

#cropBox {
    width: min(700px, calc(100vw - 24px));

    padding: 12px;

    background: #3e3e3e;

    border: 1px solid #777;
    border-radius: 5px;

    box-shadow: 0 10px 50px rgba(0,0,0,.6);
}

#cropTitle {
    margin-bottom: 10px;
    font-weight: 600;
}

#cropPreview {
    width: 100%;
    height: min(55vh, 500px);

    display: flex;
    align-items: center;
    justify-content: center;

    background: #222;
    overflow: hidden;
}

#cropCanvas {
    max-width: 100%;
    max-height: 100%;
}

.crop-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 9px;
}

.crop-row span {
    width: 80px;
}

.crop-row input {
    flex: 1;
}

.crop-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 10px;
}

@media (max-width: 600px) {
    #controls {
        top: 4px;
        width: calc(100vw - 8px);
        font-size: 12px;
    }

    .row {
        flex-wrap: wrap;
    }

    input[type="range"] {
        width: 105px;
    }

    #links {
        left: 12px;
        bottom: 12px;
    }
}

<script>
"use strict";


/* ============================================================
   ELEMENTS
   ============================================================ */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false
    });

const sourceFile =
    document.getElementById("sourceFile");

const targetFile =
    document.getElementById("targetFile");

const sourcePreview =
    document.getElementById("sourcePreview");

const targetPreview =
    document.getElementById("targetPreview");

const resolutionInput =
    document.getElementById("resolution");

const proximityInput =
    document.getElementById("proximity");

const proximityValue =
    document.getElementById("proximityValue");

const algorithmInput =
    document.getElementById("algorithm");

const progressBar =
    document.getElementById("progressBar");

const statusElement =
    document.getElementById("status");

const brushCursor =
    document.getElementById("brushCursor");

const drawControls =
    document.getElementById("drawControls");


/* ============================================================
   STATE
   ============================================================ */

let sourceImage = null;
let targetImage = null;

let sourceCanvas = null;
let targetCanvas = null;

let particles = [];

let playing = false;

let progress = 0;

let animationStart = 0;

let animationFrame = null;

let cropMode = null;
let cropImage = null;

let drawingMode = false;
let drawing = false;

let lastDrawX = 0;
let lastDrawY = 0;

let drawingDirty = false;
let drawingUpdateFrame = null;

let drawGeneration = 0;


/* ============================================================
   DEFAULT SOURCE
   ============================================================ */

function createDefaultSource() {

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 512;

    const x =
        c.getContext("2d");

    const gradient =
        x.createLinearGradient(
            0,
            0,
            512,
            512
        );

    gradient.addColorStop(
        0,
        "#888"
    );

    gradient.addColorStop(
        1,
        "#222"
    );

    x.fillStyle = gradient;

    x.fillRect(
        0,
        0,
        512,
        512
    );

    return c;
}


/* ============================================================
   FALLBACK TARGET
   ============================================================ */

function createFallbackObama() {

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 512;

    const x =
        c.getContext("2d");

    x.fillStyle = "#27354b";

    x.fillRect(
        0,
        0,
        512,
        512
    );

    x.fillStyle = "#c9946b";

    x.beginPath();

    x.ellipse(
        256,
        240,
        105,
        130,
        0,
        0,
        Math.PI * 2
    );

    x.fill();

    x.fillStyle = "#17120f";

    x.beginPath();

    x.ellipse(
        256,
        145,
        108,
        65,
        Math.PI,
        0,
        Math.PI * 2
    );

    x.fill();

    x.fillStyle = "#111";

    x.beginPath();

    x.ellipse(
        215,
        240,
        13,
        8,
        0,
        0,
        Math.PI * 2
    );

    x.ellipse(
        297,
        240,
        13,
        8,
        0,
        0,
        Math.PI * 2
    );

    x.fill();

    x.strokeStyle = "#633c2c";
    x.lineWidth = 5;

    x.beginPath();

    x.arc(
        256,
        275,
        43,
        .2,
        Math.PI - .2
    );

    x.stroke();

    x.fillStyle = "#111";

    x.beginPath();

    x.moveTo(150, 355);
    x.lineTo(362, 355);
    x.lineTo(430, 512);
    x.lineTo(82, 512);

    x.closePath();

    x.fill();

    return c;
}


/* ============================================================
   IMAGE LOADING
   ============================================================ */

function loadFile(file) {

    return new Promise((resolve, reject) => {

        if (
            !file ||
            !file.type.startsWith("image/")
        ) {

            reject(
                new Error("Invalid image")
            );

            return;
        }

        const url =
            URL.createObjectURL(file);

        const img =
            new Image();

        img.onload = () => {

            URL.revokeObjectURL(url);

            resolve(img);
        };

        img.onerror = () => {

            URL.revokeObjectURL(url);

            reject(
                new Error(
                    "Could not load image"
                )
            );
        };

        img.src = url;
    });
}


function loadURL(url) {

    return new Promise((resolve, reject) => {

        const img =
            new Image();

        img.crossOrigin =
            "anonymous";

        img.onload =
            () => resolve(img);

        img.onerror =
            () =>
                reject(
                    new Error(
                        "Could not load image"
                    )
                );

        img.src = url;
    });
}


/* ============================================================
   SQUARE CROP
   ============================================================ */

function makeSquare(
    img,
    offsetX = .5,
    offsetY = .5,
    zoom = 1
) {

    const width =
        img.naturalWidth ||
        img.width;

    const height =
        img.naturalHeight ||
        img.height;

    const side =
        Math.min(
            width,
            height
        );

    const visible =
        side / zoom;

    const maxX =
        width - visible;

    const maxY =
        height - visible;

    const sx =
        maxX * offsetX;

    const sy =
        maxY * offsetY;

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 512;

    const x =
        c.getContext("2d");

    x.imageSmoothingEnabled =
        true;

    x.drawImage(
        img,
        sx,
        sy,
        visible,
        visible,
        0,
        0,
        512,
        512
    );

    return c;
}


/* ============================================================
   PREVIEW
   ============================================================ */

function updatePreview(
    imageCanvas,
    preview
) {

    preview.src =
        imageCanvas.toDataURL(
            "image/jpeg",
            .85
        );
}


/* ============================================================
   RESIZE
   ============================================================ */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(
            innerWidth * dpr
        );

    canvas.height =
        Math.round(
            innerHeight * dpr
        );

    canvas.style.width =
        innerWidth + "px";

    canvas.style.height =
        innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();
}

window.addEventListener(
    "resize",
    resizeCanvas,
    {
        passive: true
    }
);


/* ============================================================
   DISPLAY GEOMETRY
   ============================================================ */

function getDisplayGeometry() {

    const width =
        innerWidth;

    const height =
        innerHeight;

    const size =
        Math.min(
            width,
            height
        ) * .86;

    return {
        size,

        left:
            (width - size) / 2,

        top:
            (height - size) / 2
    };
}


/* ============================================================
   COLOR DISTANCE
   ============================================================ */

function colorDistance(
    r1,
    g1,
    b1,
    r2,
    g2,
    b2
) {

    const dr =
        r1 - r2;

    const dg =
        g1 - g2;

    const db =
        b1 - b2;

    return (
        dr * dr +
        dg * dg +
        db * db
    );
}


/* ============================================================
   BUILD PIXEL DATA
   ============================================================ */

function getPixelData(
    imageCanvas,
    resolution
) {

    const data =
        imageCanvas
            .getContext("2d")
            .getImageData(
                0,
                0,
                512,
                512
            ).data;

    const step =
        512 / resolution;

    const pixels =
        new Array(
            resolution * resolution
        );

    let index = 0;

    for (
        let y = 0;
        y < resolution;
        y++
    ) {

        for (
            let x = 0;
            x < resolution;
            x++
        ) {

            const px =
                Math.min(
                    511,
                    Math.floor(
                        (x + .5) * step
                    )
                );

            const py =
                Math.min(
                    511,
                    Math.floor(
                        (y + .5) * step
                    )
                );

            const sourceIndex =
                (
                    py * 512 +
                    px
                ) * 4;

            const r =
                data[sourceIndex];

            const g =
                data[sourceIndex + 1];

            const b =
                data[sourceIndex + 2];

            pixels[index++] = {

                x: x + .5,
                y: y + .5,

                r,
                g,
                b,

                brightness:
                    (
                        r +
                        g +
                        b
                    ) / 3
            };
        }
    }

    return pixels;
}


/* ============================================================
   FAST ONE-TO-ONE MATCHING
   ============================================================

   Important difference from the broken version:

   A target position is reserved immediately.

   There is NO duplicate repair pass.

   Every source pixel receives exactly one unique
   destination.

   The RGB values of the source are never changed.
   ============================================================ */

function buildFastAssignments(
    source,
    target,
    proximity
) {

    const count =
        source.length;

    const result =
        new Array(count);

    const used =
        new Uint8Array(count);


    /*
     * Sort both images by brightness.
     *
     * This gives us a very good initial approximation
     * while remaining extremely cheap.
     */

    const sourceOrder =
        Array.from(
            { length: count },
            (_, i) => i
        );

    const targetOrder =
        Array.from(
            { length: count },
            (_, i) => i
        );

    sourceOrder.sort(
        (a, b) =>
            source[a].brightness -
            source[b].brightness
    );

    targetOrder.sort(
        (a, b) =>
            target[a].brightness -
            target[b].brightness
    );


    /*
     * Assign brightness ranks first.
     */

    for (
        let rank = 0;
        rank < count;
        rank++
    ) {

        const sourceIndex =
            sourceOrder[rank];

        const targetIndex =
            targetOrder[rank];

        result[sourceIndex] =
            targetIndex;
    }


    /*
     * Local refinement.
     *
     * Only swap destinations.
     *
     * Source RGB stays untouched.
     */

    const iterations =
        proximity <= .05
            ? 1
            : 2;


    for (
        let iteration = 0;
        iteration < iterations;
        iteration++
    ) {

        for (
            let i = 0;
            i < count;
            i++
        ) {

            const targetIndex =
                result[i];

            if (
                targetIndex == null
            )
                continue;


            const p =
                source[i];

            const q =
                target[targetIndex];


            /*
             * Check a small neighborhood in
             * brightness order.

             * This avoids the O(n²) behavior that
             * caused the lag in the previous version.
             */

            const rank =
                Math.floor(
                    (
                        source[i].brightness / 256
                    ) * count
                );


            const window =
                proximity > .5
                    ? 18
                    : 10;


            let bestIndex =
                targetIndex;

            let bestScore =
                Infinity;


            const center =
                Math.max(
                    0,
                    Math.min(
                        count - 1,
                        rank
                    )
                );


            const start =
                Math.max(
                    0,
                    center - window
                );

            const end =
                Math.min(
                    count,
                    center + window + 1
                );


            for (
                let r = start;
                r < end;
                r++
            ) {

                const candidateIndex =
                    targetOrder[r];

                if (
                    used[candidateIndex]
                )
                    continue;


                const candidate =
                    target[candidateIndex];


                const color =
                    colorDistance(
                        p.r,
                        p.g,
                        p.b,
                        candidate.r,
                        candidate.g,
                        candidate.b
                    );


                const dx =
                    p.x -
                    candidate.x;

                const dy =
                    p.y -
                    candidate.y;


                const distance =
                    dx * dx +
                    dy * dy;


                const score =
                    color +
                    distance *
                    proximity *
                    80;


                if (
                    score <
                    bestScore
                ) {

                    bestScore =
                        score;

                    bestIndex =
                        candidateIndex;
                }
            }


            result[i] =
                bestIndex;
        }


        /*
         * Rebuild uniqueness from scratch.
         */

        used.fill(0);

        for (
            let i = 0;
            i < count;
            i++
        ) {

            let destination =
                result[i];


            if (
                used[destination]
            ) {

                /*
                 * Search outward for the nearest
                 * unused brightness position.
                 */

                const original =
                    targetOrder.findIndex(
                        v =>
                            v === destination
                    );


                let found =
                    -1;


                for (
                    let radius = 1;
                    radius < count;
                    radius++
                ) {

                    const a =
                        original - radius;

                    const b =
                        original + radius;


                    if (
                        a >= 0 &&
                        !used[targetOrder[a]]
                    ) {

                        found =
                            targetOrder[a];

                        break;
                    }


                    if (
                        b < count &&
                        !used[targetOrder[b]]
                    ) {

                        found =
                            targetOrder[b];

                        break;
                    }
                }


                if (
                    found >= 0
                ) {

                    destination =
                        found;

                    result[i] =
                        destination;
                }
            }


            used[destination] =
                1;
        }
    }


    return result;
}


/* ============================================================
   BETTER MATCHING
   ============================================================ */

function buildOptimalAssignments(
    source,
    target,
    proximity
) {

    const count =
        source.length;

    const result =
        new Int32Array(count);

    const used =
        new Uint8Array(count);


    /*
     * Instead of comparing every pixel with every
     * other pixel, bucket target pixels by brightness.
     */

    const buckets =
        Array.from(
            { length: 256 },
            () => []
        );


    for (
        let i = 0;
        i < count;
        i++
    ) {

        const brightness =
            Math.max(
                0,
                Math.min(
                    255,
                    Math.round(
                        target[i].brightness
                    )
                )
            );

        buckets[brightness].push(i);
    }


    /*
     * Process visually distinctive pixels first.
     */

    const order =
        Array.from(
            { length: count },
            (_, i) => i
        );


    order.sort(
        (a, b) => {

            const ar =
                source[a].r;

            const ag =
                source[a].g;

            const ab =
                source[a].b;

            const br =
                source[b].r;

            const bg =
                source[b].g;

            const bb =
                source[b].b;


            const as =
                Math.max(ar, ag, ab) -
                Math.min(ar, ag, ab);

            const bs =
                Math.max(br, bg, bb) -
                Math.min(br, bg, bb);


            return bs - as;
        }
    );


    for (
        let oi = 0;
        oi < order.length;
        oi++
    ) {

        const sourceIndex =
            order[oi];

        const p =
            source[sourceIndex];


        const brightness =
            Math.round(
                p.brightness
            );


        const searchRadius =
            algorithmInput.value === "optimal"
                ? 18
                : 8;


        let best =
            -1;

        let bestScore =
            Infinity;


        for (
            let radius = 0;
            radius <= searchRadius;
            radius++
        ) {

            const low =
                brightness - radius;

            const high =
                brightness + radius;


            if (
                low >= 0
            ) {

                const bucket =
                    buckets[low];


                for (
                    let k = 0;
                    k < bucket.length;
                    k++
                ) {

                    const targetIndex =
                        bucket[k];


                    if (
                        used[targetIndex]
                    )
                        continue;


                    const q =
                        target[targetIndex];


                    const color =
                        colorDistance(
                            p.r,
                            p.g,
                            p.b,
                            q.r,
                            q.g,
                            q.b
                        );


                    const dx =
                        p.x -
                        q.x;

                    const dy =
                        p.y -
                        q.y;


                    const spatial =
                        dx * dx +
                        dy * dy;


                    const score =
                        color +
                        spatial *
                        proximity *
                        80;


                    if (
                        score <
                        bestScore
                    ) {

                        bestScore =
                            score;

                        best =
                            targetIndex;
                    }
                }
            }


            if (
                high <= 255 &&
                high !== low
            ) {

                const bucket =
                    buckets[high];


                for (
                    let k = 0;
                    k < bucket.length;
                    k++
                ) {

                    const targetIndex =
                        bucket[k];


                    if (
                        used[targetIndex]
                    )
                        continue;


                    const q =
                        target[targetIndex];


                    const color =
                        colorDistance(
                            p.r,
                            p.g,
                            p.b,
                            q.r,
                            q.g,
                            q.b
                        );


                    const dx =
                        p.x -
                        q.x;

                    const dy =
                        p.y -
                        q.y;


                    const spatial =
                        dx * dx +
                        dy * dy;


                    const score =
                        color +
                        spatial *
                        proximity *
                        80;


                    if (
                        score <
                        bestScore
                    ) {

                        bestScore =
                            score;

                        best =
                            targetIndex;
                    }
                }
            }


            /*
             * If we already found a very good
             * color match, don't keep searching.
             */

            if (
                best >= 0 &&
                bestScore < 300
            )
                break;
        }


        /*
         * Guaranteed fallback.
         */

        if (
            best < 0
        ) {

            for (
                let i = 0;
                i < count;
                i++
            ) {

                if (
                    !used[i]
                ) {

                    best =
                        i;

                    break;
                }
            }
        }


        result[sourceIndex] =
            best;

        used[best] =
            1;
    }


    return result;
}


/* ============================================================
   BUILD PARTICLES
   ============================================================ */

function buildPixels() {

    if (
        !sourceCanvas ||
        !targetCanvas
    )
        return;


    const requested =
        Number(
            resolutionInput.value
        );


    const resolution =
        Math.max(
            8,
            Math.min(
                128,
                Number.isFinite(requested)
                    ? Math.floor(requested)
                    : 64
            )
        );


    resolutionInput.value =
        resolution;


    statusElement.textContent =
        "reading pixels...";

    progressBar.style.width =
        "5%";


    const source =
        getPixelData(
            sourceCanvas,
            resolution
        );


    const target =
        getPixelData(
            targetCanvas,
            resolution
        );


    progressBar.style.width =
        "20%";


    const proximity =
        Math.max(
            0,
            Math.min(
                1,
                Number(
                    proximityInput.value
                ) || 0
            )
        );


    let assignments;


    if (
        algorithmInput.value === "optimal"
    ) {

        statusElement.textContent =
            "matching pixels...";

        assignments =
            buildOptimalAssignments(
                source,
                target,
                proximity
            );

    } else {

        statusElement.textContent =
            "matching pixels...";

        assignments =
            buildFastAssignments(
                source,
                target,
                proximity
            );
    }


    progressBar.style.width =
        "80%";


    particles =
        new Array(
            source.length
        );


    for (
        let i = 0;
        i < source.length;
        i++
    ) {

        const p =
            source[i];

        const destination =
            target[
                assignments[i]
            ];


        /*
         * THIS IS THE IMPORTANT PART.
         *
         * r/g/b come ONLY from the source.
         *
         * Target colors are used exclusively
         * to decide where the pixel moves.
         */

        particles[i] = {

            ox:
                p.x,

            oy:
                p.y,

            tx:
                destination.x,

            ty:
                destination.y,

            r:
                p.r,

            g:
                p.g,

            b:
                p.b
        };
    }


    progressBar.style.width =
        "100%";

    statusElement.textContent =
        `${source.length} pixels`;

    draw();
}


/* ============================================================
   EASING
   ============================================================ */

function ease(t) {

    return t < .5
        ? 4 * t * t * t
        : 1 -
          Math.pow(
              -2 * t + 2,
              3
          ) / 2;
}


/* ============================================================
   DRAW IMAGE
   ============================================================ */

function drawSourceImage() {

    if (!sourceCanvas)
        return;


    const {
        size,
        left,
        top
    } =
        getDisplayGeometry();


    ctx.imageSmoothingEnabled =
        true;

    ctx.drawImage(
        sourceCanvas,
        left,
        top,
        size,
        size
    );
}


/* ============================================================
   DRAW PARTICLES
   ============================================================ */

function draw(
    animationProgress = progress
) {

    const width =
        innerWidth;

    const height =
        innerHeight;


    ctx.fillStyle =
        "#404040";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    if (
        !sourceCanvas
    )
        return;


    if (
        !particles.length
    ) {

        drawSourceImage();

        return;
    }


    const {
        size,
        left,
        top
    } =
        getDisplayGeometry();


    const resolution =
        Math.max(
            8,
            Math.min(
                128,
                Number(
                    resolutionInput.value
                ) || 64
            )
        );


    const cell =
        size / resolution;


    const e =
        ease(
            Math.max(
                0,
                Math.min(
                    1,
                    animationProgress
                )
            )
        );


    /*
     * Pixels move.

     * Their colors NEVER interpolate.
     */

    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        const p =
            particles[i];


        const x =
            p.ox +
            (
                p.tx -
                p.ox
            ) * e;


        const y =
            p.oy +
            (
                p.ty -
                p.oy
            ) * e;


        ctx.fillStyle =
            `rgb(${p.r},${p.g},${p.b})`;


        ctx.fillRect(
            left +
            x * cell,

            top +
            y * cell,

            Math.ceil(cell) + 1,
            Math.ceil(cell) + 1
        );
    }
}


/* ============================================================
   PROGRESS
   ============================================================ */

function setProgress(
    value
) {

    const v =
        Math.max(
            0,
            Math.min(
                1,
                value
            )
        );

    progressBar.style.width =
        `${v * 100}%`;
}


/* ============================================================
   ANIMATION
   ============================================================ */

function animationLoop(time) {

    if (!playing)
        return;


    const duration =
        5000;


    progress =
        Math.min(
            1,
            (
                time -
                animationStart
            ) / duration
        );


    setProgress(progress);

    statusElement.textContent =
        `moving pixels ${Math.round(progress * 100)}%`;


    draw(progress);


    if (
        progress >= 1
    ) {

        playing =
            false;

        document
            .getElementById("play")
            .textContent =
                "▶";

        statusElement.textContent =
            "complete";

        animationFrame =
            null;

        return;
    }


    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}


function startAnimation() {

    if (
        !particles.length
    ) {

        buildPixels();

        if (
            !particles.length
        )
            return;
    }


    if (
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );
    }


    progress =
        0;

    playing =
        true;

    animationStart =
        performance.now();


    document
        .getElementById("play")
        .textContent =
            "Ⅱ";


    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}


function reset() {

    playing =
        false;


    if (
        animationFrame
    ) {

        cancelAnimationFrame(
            animationFrame
        );
    }


    animationFrame =
        null;

    progress =
        0;

    setProgress(0);


    document
        .getElementById("play")
        .textContent =
            "▶";


    statusElement.textContent =
        particles.length
            ? "ready"
            : "source";


    draw();
}

/* ============================================================
   CANVAS POINTER COORDINATES
   ============================================================ */

function getImageCoordinates(
    clientX,
    clientY
) {

    const {
        size,
        left,
        top
    } =
        getDisplayGeometry();


    const x =
        (
            clientX -
            left
        ) / size * 512;


    const y =
        (
            clientY -
            top
        ) / size * 512;


    return {
        x,
        y
    };
}


/* ============================================================
   DRAW ON SOURCE CANVAS
   ============================================================ */

function paintAt(
    x,
    y
) {

    if (!sourceCanvas)
        return;


    const radius =
        Number(
            brushSize.value
        ) / 2;


    const sourceCtx =
        sourceCanvas.getContext(
            "2d"
        );


    sourceCtx.fillStyle =
        brushColor.value;


    sourceCtx.beginPath();

    sourceCtx.arc(
        x,
        y,
        radius,
        0,
        Math.PI * 2
    );

    sourceCtx.fill();


    drawingDirty =
        true;


    scheduleLiveRebuild();
}


/* ============================================================
   SMOOTH DRAWING LINE
   ============================================================ */

function paintLine(
    x1,
    y1,
    x2,
    y2
) {

    if (!sourceCanvas)
        return;


    const distance =
        Math.hypot(
            x2 - x1,
            y2 - y1
        );


    const brush =
        Number(
            brushSize.value
        );


    /*
     * Small number of interpolation points.
     *
     * This prevents gaps without generating
     * thousands of circles.
     */

    const steps =
        Math.max(
            1,
            Math.ceil(
                distance /
                Math.max(
                    1,
                    brush * .45
                )
            )
        );


    const sourceCtx =
        sourceCanvas.getContext(
            "2d"
        );


    sourceCtx.fillStyle =
        brushColor.value;


    sourceCtx.beginPath();


    for (
        let i = 0;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;


        const x =
            x1 +
            (
                x2 - x1
            ) * t;


        const y =
            y1 +
            (
                y2 - y1
            ) * t;


        sourceCtx.moveTo(
            x + brush * .5,
            y
        );

        sourceCtx.arc(
            x,
            y,
            brush * .5,
            0,
            Math.PI * 2
        );
    }


    sourceCtx.fill();


    drawingDirty =
        true;


    scheduleLiveRebuild();
}


/* ============================================================
   LIVE REBUILD
   ============================================================

   Drawing itself is immediate.

   Matching is throttled to at most one rebuild per
   animation frame, preventing the lag that happened
   when the algorithm was executed for every pointer
   event.
   ============================================================ */

function scheduleLiveRebuild() {

    if (
        drawingUpdateFrame
    )
        return;


    drawingUpdateFrame =
        requestAnimationFrame(
            () => {

                drawingUpdateFrame =
                    null;


                if (!drawingDirty)
                    return;


                drawingDirty =
                    false;


                /*
                 * If the user is currently watching the
                 * transformation, don't restart it.
                 *
                 * Instead rebuild the source particles
                 * and continue from the current progress.
                 */

                const wasPlaying =
                    playing;


                const oldProgress =
                    progress;


                try {

                    buildPixels();

                    if (
                        wasPlaying
                    ) {

                        progress =
                            oldProgress;

                        draw(progress);

                    } else {

                        draw();
                    }

                } catch (error) {

                    console.error(
                        error
                    );
                }
            }
        );
}


/* ============================================================
   POINTER EVENTS
   ============================================================ */

canvas.addEventListener(
    "pointerdown",
    event => {

        if (!drawingMode)
            return;


        event.preventDefault();


        drawing =
            true;


        canvas.setPointerCapture(
            event.pointerId
        );


        const point =
            getImageCoordinates(
                event.clientX,
                event.clientY
            );


        lastDrawX =
            point.x;

        lastDrawY =
            point.y;


        paintAt(
            point.x,
            point.y
        );


        updateBrushCursor(
            event.clientX,
            event.clientY
        );
    }
);


canvas.addEventListener(
    "pointermove",
    event => {

        if (
            drawingMode
        ) {

            updateBrushCursor(
                event.clientX,
                event.clientY
            );
        }


        if (
            !drawing
        )
            return;


        event.preventDefault();


        const point =
            getImageCoordinates(
                event.clientX,
                event.clientY
            );


        paintLine(
            lastDrawX,
            lastDrawY,
            point.x,
            point.y
        );


        lastDrawX =
            point.x;

        lastDrawY =
            point.y;
    }
);


canvas.addEventListener(
    "pointerup",
    event => {

        drawing =
            false;


        try {

            canvas.releasePointerCapture(
                event.pointerId
            );

        } catch {}
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        drawing =
            false;
    }
);


canvas.addEventListener(
    "pointerleave",
    () => {

        if (!drawing)
            brushCursor.style.display =

);


canvas.addEventListener(

    const zoom =

            document
                .getElementById("cropZoom")
                .value
        );


    const image =
        makeSquare(
            cropImage,
            x,
            y,
            zoom
        );


    cropCtx.clearRect(
        0,
        0,
        512,
        512
    );


    cropCtx.drawImage(
        image,
        0,
        0
    );
}


document
    .getElementById("sourceCrop")
    .addEventListener(
        "click",
        () =>
            openCrop("source")
    );


document
    .getElementById("targetCrop")
    .addEventListener(
        "click",
        () =>
            openCrop("target")
    );


for (
    const id of [
        "cropX",
        "cropY",
        "cropZoom"
    ]
) {

    document
        .getElementById(id)
        .addEventListener(
            "input",
            updateCropPreview
        );
}


document
    .getElementById("cropCancel")
    .addEventListener(
        "click",
        () => {

            cropOverlay
                .classList
                .remove("open");
        }
    );


document
    .getElementById("cropApply")
    .addEventListener(
        "click",
        () => {

            if (!cropImage)
                return;


            const x =
                Number(
                    document
                        .getElementById("cropX")
                        .value
                ) / 100;


            const y =
                Number(
                    document
                        .getElementById("cropY")
                        .value
                ) / 100;


            const zoom =
                Number(
                    document
                        .getElementById("cropZoom")
                        .value
                );


            const cropped =
                makeSquare(
                    cropImage,
                    x,
                    y,
                    zoom
                );


            if (
                cropMode === "source"
            ) {

                sourceCanvas =
                    cropped;

                sourceImage =
                    null;

                updatePreview(
                    sourceCanvas,
                    sourcePreview
                );

            } else {

                targetCanvas =
                    cropped;

                targetImage =
                    null;

                updatePreview(
                    targetCanvas,
                    targetPreview
                );
            }


            particles =
                [];


            cropOverlay
                .classList
                .remove("open");


            reset();
        }
    );

document
    .getElementById("advancedButton")
    .addEventListener(
        "click",

            document
                .getElementById("advanced")
                .classList

        }
    );


proximityInput.addEventListener(

);


resolutionInput.addEventListener(

        const value =

                8,
                Math.min(
                    128,
                    Number(
                        resolutionInput.value
                    ) || 64
                )
            );


        resolutionInput.value =
            value;


        particles =
            [];


        reset();
    }
);


algorithmInput.addEventListener(
    "change",
    () => {

        particles =
            [];

        reset();
    }
);


/* ============================================================
   SAVE
   ============================================================ */

document
    .getElementById("save")
    .addEventListener(
        "click",
        async () => {

            if (
                !particles.length
            )
                buildPixels();


            if (
                !canvas.captureStream ||
                !window.MediaRecorder
            ) {

                alert(
                    "Animation export is not supported by this browser."
                );

                return;
            }


            const stream =
                canvas.captureStream(
                    30
                );


            let mime =
                "video/webm";


            if (
                MediaRecorder.isTypeSupported(
                    "video/webm;codecs=vp9"
                )
            ) {

                mime =
                    "video/webm;codecs=vp9";
            }


            const recorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType: mime
                    }
                );


            const chunks = [];


            recorder.ondataavailable =
                event => {

                    if (
                        event.data.size
                    ) {

                        chunks.push(
                            event.data
                        );
                    }
                };


            recorder.onstop =
                () => {

                    const blob =
                        new Blob(
                            chunks,
                            {
                                type: mime
                            }
                        );


                    const url =
                        URL.createObjectURL(
                            blob
                        );


                    const a =
                        document.createElement(
                            "a"
                        );


                    a.href =
                        url;

                    a.download =
                        "obamify.webm";


                    document.body.appendChild(
                        a
                    );


                    a.click();

                    a.remove();


                    setTimeout(
                        () =>
                            URL.revokeObjectURL(
                                url
                            ),
                        1000
                    );
                };


            recorder.start();


            const start =
                performance.now();


            function record(time) {

                const p =
                    Math.min(
                        1,
                        (
                            time -
                            start
                        ) / 5000
                    );


                draw(p);

                setProgress(p);


                if (
                    p < 1
                ) {

                    requestAnimationFrame(
                        record
                    );

                } else {

                    setTimeout(
                        () =>
                            recorder.stop(),
                        100
                    );
                }
            }


            requestAnimationFrame(
                record
            );
        }
    );


/* ============================================================
   INITIALIZATION
   ============================================================ */

async function init() {

    sourceCanvas =
        createDefaultSource();


    updatePreview(
        sourceCanvas,
        sourcePreview
    );


    try {

        targetImage =
            await loadURL(
                "https://qikseekdev.github.io/Some-wild-shi/obama.png"
            );


        targetCanvas =
            makeSquare(
                targetImage
            );

    } catch {

        targetCanvas =
            createFallbackObama();
    }


    updatePreview(
        targetCanvas,
        targetPreview
    );


    resizeCanvas();
}


init();

</script>
