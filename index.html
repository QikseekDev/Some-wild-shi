<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Obamify</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #404040;
    color: #eee;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
}

#drawCanvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: none;
    z-index: 10;
    touch-action: none;
    cursor: crosshair;
}

#drawCanvas.open {
    display: block;
}

/* ============================================================
   CONTROLS
   ============================================================ */

#controls {
    position: fixed;
    z-index: 20;

    top: 8px;
    left: 50%;
    transform: translateX(-50%);

    width: min(800px, calc(100vw - 16px));

    padding: 6px;

    background: rgba(48, 48, 48, .96);

    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 4px;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, .45),
        0 8px 24px rgba(0, 0, 0, .2);

    font-size: 13px;

    user-select: none;
    -webkit-user-select: none;
}

.row {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 30px;
}

.row + .row {
    margin-top: 5px;
}

button,
select,
input {
    font: inherit;
}

button,
select {
    color: #eee;
    background: #555;
    border: 1px solid #707070;
    border-radius: 3px;
}

button {
    min-height: 27px;
    padding: 3px 9px;
    cursor: pointer;
}

button:hover {
    background: #626262;
}

button:active {
    background: #444;
}

button:disabled {
    opacity: .5;
    cursor: default;
}

select {
    min-height: 27px;
    padding: 2px 7px;
}

input[type="number"] {
    width: 65px;
    min-height: 27px;
    padding: 3px 6px;
    color: white;
    background: #444;
    border: 1px solid #707070;
    border-radius: 3px;
}

input[type="range"] {
    width: 130px;
    accent-color: #aaa;
}

input[type="color"] {
    width: 32px;
    height: 27px;
    padding: 1px;
    border: 1px solid #707070;
    border-radius: 3px;
    background: #444;
}

.spacer {
    flex: 1;
}

.label {
    color: #ccc;
    white-space: nowrap;
}

.value {
    width: 38px;
    text-align: right;
    color: #aaa;
    font-variant-numeric: tabular-nums;
}

.image-button {
    display: flex;
    align-items: center;
    gap: 6px;
}

.image-button img {
    width: 27px;
    height: 27px;
    object-fit: cover;
    border-radius: 2px;
    background: #222;
}

/* ============================================================
   ADVANCED
   ============================================================ */

#advanced {
    display: none;

    margin-top: 5px;
    padding-top: 5px;

    border-top: 1px solid rgba(255,255,255,.08);
}

#advanced.open {
    display: block;
}

/* ============================================================
   PROGRESS
   ============================================================ */

#progressContainer {
    width: 100%;
    height: 5px;

    margin-top: 6px;

    background: #292929;

    border-radius: 3px;

    overflow: hidden;
}

#progressBar {
    width: 0%;
    height: 100%;

    background: #aaa;

    transition: width .04s linear;
}

/* ============================================================
   DRAWING PANEL
   ============================================================ */

#drawTools {
    display: none;

    margin-top: 5px;
    padding-top: 5px;

    border-top: 1px solid rgba(255,255,255,.08);
}

#drawTools.open {
    display: block;
}

.draw-indicator {
    color: #aaa;
    font-size: 11px;
}

/* ============================================================
   CROP
   ============================================================ */

#cropOverlay {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.75);
}

#cropOverlay.open {
    display: flex;
}

#cropBox {
    width: min(700px, calc(100vw - 24px));

    padding: 12px;

    background: #3e3e3e;

    border: 1px solid #777;
    border-radius: 5px;

    box-shadow:
        0 10px 50px rgba(0,0,0,.6);
}

#cropTitle {
    margin-bottom: 10px;
    font-weight: 600;
}

#cropPreview {
    width: 100%;
    height: min(55vh, 500px);

    display: flex;
    align-items: center;
    justify-content: center;

    background: #222;

    overflow: hidden;
}

#cropCanvas {
    max-width: 100%;
    max-height: 100%;
}

.crop-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 9px;
}

.crop-row span {
    width: 80px;
}

.crop-row input {
    flex: 1;
}

.crop-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    margin-top: 10px;
}

/* ============================================================
   LINKS
   ============================================================ */

#links {
    position: fixed;
    z-index: 20;

    left: 18px;
    bottom: 18px;

    display: flex;
    flex-direction: column;
    gap: 10px;
}

.link {
    width: 45px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    border-radius: 8px;

    text-decoration: none;

    transition: transform .15s;
}

.link:hover {
    transform: scale(1.08);
}

.link svg {
    width: 29px;
    height: 29px;
    fill: white;
}

/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 600px) {

    #controls {
        top: 4px;
        width: calc(100vw - 8px);
        font-size: 12px;
    }

    .row {
        flex-wrap: wrap;
    }

    input[type="range"] {
        width: 105px;
    }

    #links {
        left: 12px;
        bottom: 12px;
    }
}
</style>

<script>
"use strict";

/* ============================================================
   ELEMENTS
   ============================================================ */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d", {
        alpha: false
    });

const drawCanvas =
    document.getElementById("drawCanvas");

const drawCtx =
    drawCanvas.getContext("2d", {
        alpha: false
    });

const sourceFile =
    document.getElementById("sourceFile");

const targetFile =
    document.getElementById("targetFile");

const sourcePreview =
    document.getElementById("sourcePreview");

const targetPreview =
    document.getElementById("targetPreview");

const resolutionInput =
    document.getElementById("resolution");

const proximityInput =
    document.getElementById("proximity");

const proximityValue =
    document.getElementById("proximityValue");

const algorithmInput =
    document.getElementById("algorithm");

const progressBar =
    document.getElementById("progressBar");

const drawColor =
    document.getElementById("drawColor");

const brushSize =
    document.getElementById("brushSize");

const brushValue =
    document.getElementById("brushValue");

const drawTools =
    document.getElementById("drawTools");


/* ============================================================
   STATE
   ============================================================ */

let sourceImage = null;
let targetImage = null;

let sourceCanvas = null;
let targetCanvas = null;

let particles = [];

let playing = false;
let progress = 0;

let animationStart = 0;
let animationFrame = null;

let cropMode = null;
let cropImage = null;

let drawing = false;

let drawingDirty = false;
let drawingRebuildQueued = false;

let lastDrawX = 0;
let lastDrawY = 0;


/* ============================================================
   DEFAULT SOURCE
   ============================================================ */

function createDefaultSource() {

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 512;

    const x =
        c.getContext("2d");

    const gradient =
        x.createLinearGradient(
            0,
            0,
            512,
            512
        );

    gradient.addColorStop(
        0,
        "#888"
    );

    gradient.addColorStop(
        1,
        "#222"
    );

    x.fillStyle =
        gradient;

    x.fillRect(
        0,
        0,
        512,
        512
    );

    return c;
}


/* ============================================================
   FALLBACK TARGET
   ============================================================ */

function createFallbackObama() {

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 512;

    const x =
        c.getContext("2d");

    x.fillStyle =
        "#27354b";

    x.fillRect(
        0,
        0,
        512,
        512
    );

    x.fillStyle =
        "#c9946b";

    x.beginPath();

    x.ellipse(
        256,
        240,
        105,
        130,
        0,
        0,
        Math.PI * 2
    );

    x.fill();

    x.fillStyle =
        "#17120f";

    x.beginPath();

    x.ellipse(
        256,
        145,
        108,
        65,
        Math.PI,
        0,
        Math.PI * 2
    );

    x.fill();

    x.fillStyle =
        "#111";

    x.beginPath();

    x.ellipse(
        215,
        240,
        13,
        8,
        0,
        0,
        Math.PI * 2
    );

    x.ellipse(
        297,
        240,
        13,
        8,
        0,
        0,
        Math.PI * 2
    );

    x.fill();

    x.strokeStyle =
        "#633c2c";

    x.lineWidth =
        5;

    x.beginPath();

    x.arc(
        256,
        275,
        43,
        .2,
        Math.PI - .2
    );

    x.stroke();

    x.fillStyle =
        "#111";

    x.beginPath();

    x.moveTo(150, 355);
    x.lineTo(362, 355);
    x.lineTo(430, 512);
    x.lineTo(82, 512);

    x.closePath();

    x.fill();

    return c;
}


/* ============================================================
   IMAGE LOADING
   ============================================================ */

function loadFile(file) {

    return new Promise(
        (resolve, reject) => {

            if (
                !file ||
                !file.type.startsWith("image/")
            ) {

                reject(
                    new Error(
                        "Invalid image"
                    )
                );

                return;
            }

            const url =
                URL.createObjectURL(file);

            const img =
                new Image();

            img.onload = () => {

                URL.revokeObjectURL(url);

                resolve(img);
            };

            img.onerror = () => {

                URL.revokeObjectURL(url);

                reject(
                    new Error(
                        "Could not load image"
                    )
                );
            };

            img.src =
                url;
        }
    );
}


function loadURL(url) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();

            img.crossOrigin =
                "anonymous";

            img.onload =
                () => resolve(img);

            img.onerror =
                () =>
                    reject(
                        new Error(
                            "Could not load image"
                        )
                    );

            img.src =
                url;
        }
    );
}


/* ============================================================
   SQUARE CROP
   ============================================================ */

function makeSquare(
    img,
    offsetX = .5,
    offsetY = .5,
    zoom = 1
) {

    const width =
        img.naturalWidth ||
        img.width;

    const height =
        img.naturalHeight ||
        img.height;

    const side =
        Math.min(
            width,
            height
        );

    const visible =
        side / zoom;

    const maxX =
        width - visible;

    const maxY =
        height - visible;

    const sx =
        Math.max(
            0,
            maxX * offsetX
        );

    const sy =
        Math.max(
            0,
            maxY * offsetY
        );

    const c =
        document.createElement("canvas");

    c.width =
        512;

    c.height =
        512;

    const x =
        c.getContext("2d");

    x.imageSmoothingEnabled =
        true;

    x.drawImage(
        img,
        sx,
        sy,
        visible,
        visible,
        0,
        0,
        512,
        512
    );

    return c;
}


/* ============================================================
   PREVIEW
   ============================================================ */

function updatePreview(
    canvasElement,
    previewElement
) {

    previewElement.src =
        canvasElement.toDataURL(
            "image/jpeg",
            .85
        );
}


/* ============================================================
   RESIZE
   ============================================================ */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(
            innerWidth * dpr
        );

    canvas.height =
        Math.round(
            innerHeight * dpr
        );

    canvas.style.width =
        innerWidth + "px";

    canvas.style.height =
        innerHeight + "px";

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    drawCanvas.width =
        Math.round(
            innerWidth * dpr
        );

    drawCanvas.height =
        Math.round(
            innerHeight * dpr
        );

    drawCanvas.style.width =
        innerWidth + "px";

    drawCanvas.style.height =
        innerHeight + "px";

    drawCtx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();
}

window.addEventListener(
    "resize",
    resizeCanvas,
    {
        passive: true
    }
);


/* ============================================================
   DRAWING CANVAS
   ============================================================ */

function setupDrawingCanvas() {

    drawCtx.clearRect(
        0,
        0,
        innerWidth,
        innerHeight
    );

    drawCtx.fillStyle =
        "#404040";

    drawCtx.fillRect(
        0,
        0,
        innerWidth,
        innerHeight
    );

    if (!sourceCanvas)
        return;

    const size =
        Math.min(
            innerWidth,
            innerHeight
        ) * .86;

    const left =
        (innerWidth - size) / 2;

    const top =
        (innerHeight - size) / 2;

    drawCtx.imageSmoothingEnabled =
        true;

    drawCtx.drawImage(
        sourceCanvas,
        left,
        top,
        size,
        size
    );
}


/* ============================================================
   DRAWING COORDINATES
   ============================================================ */

function screenToImage(
    clientX,
    clientY
) {

    const size =
        Math.min(
            innerWidth,
            innerHeight
        ) * .86;

    const left =
        (innerWidth - size) / 2;

    const top =
        (innerHeight - size) / 2;

    return {

        x:
            (clientX - left) *
            512 /
            size,

        y:
            (clientY - top) *
            512 /
            size
    };
}


/* ============================================================
   DRAWING BRUSH
   ============================================================ */

function drawBrush(
    x,
    y
) {

    if (
        x < 0 ||
        y < 0 ||
        x > 512 ||
        y > 512
    )
        return;

    const size =
        Number(
            brushSize.value
        ) || 5;

    const displaySize =
        Math.min(
            innerWidth,
            innerHeight
        ) * .86;

    const scale =
        displaySize / 512;

    const radius =
        Math.max(
            1,
            size * scale / 2
        );

    const px =
        (
            (innerWidth -
            displaySize) / 2
        ) +
        x * scale;

    const py =
        (
            (innerHeight -
            displaySize) / 2
        ) +
        y * scale;

    drawCtx.fillStyle =
        drawColor.value;

    drawCtx.beginPath();

    drawCtx.arc(
        px,
        py,
        radius,
        0,
        Math.PI * 2
    );

    drawCtx.fill();

    drawingDirty =
        true;

    queueRealtimeSourceUpdate();
}


/* ============================================================
   SMOOTH BRUSH LINE
   ============================================================ */

function drawLine(
    x1,
    y1,
    x2,
    y2
) {

    const distance =
        Math.hypot(
            x2 - x1,
            y2 - y1
        );

    const size =
        Number(
            brushSize.value
        ) || 5;

    const steps =
        Math.max(
            1,
            Math.ceil(
                distance /
                Math.max(
                    1,
                    size * .35
                )
            )
        );

    for (
        let i = 0;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;

        drawBrush(
            x1 +
            (x2 - x1) * t,

            y1 +
            (y2 - y1) * t
        );
    }
}


/* ============================================================
   POINTER DRAWING
   ============================================================ */

drawCanvas.addEventListener(
    "pointerdown",
    event => {

        if (
            !drawCanvas.classList.contains("open")
        )
            return;

        event.preventDefault();

        drawing =
            true;

        drawCanvas.setPointerCapture(
            event.pointerId
        );

        const p =
            screenToImage(
                event.clientX,
                event.clientY
            );

        lastDrawX =
            p.x;

        lastDrawY =
            p.y;

        drawBrush(
            p.x,
            p.y
        );
    }
);


drawCanvas.addEventListener(
    "pointermove",
    event => {

        if (!drawing)
            return;

        event.preventDefault();

        const p =
            screenToImage(
                event.clientX,
                event.clientY
            );

        drawLine(
            lastDrawX,
            lastDrawY,
            p.x,
            p.y
        );

        lastDrawX =
            p.x;

        lastDrawY =
            p.y;
    }
);


function stopDrawing(event) {

    drawing =
        false;

    try {

        if (
            event &&
            drawCanvas.hasPointerCapture(
                event.pointerId
            )
        ) {

            drawCanvas.releasePointerCapture(
                event.pointerId
            );
        }

    } catch {}
}


drawCanvas.addEventListener(
    "pointerup",
    stopDrawing
);

drawCanvas.addEventListener(
    "pointercancel",
    stopDrawing
);

drawCanvas.addEventListener(
    "pointerleave",
    event => {

        if (
            drawing &&
            event.pointerType === "mouse"
        )
            drawing = false;
    }
);


/* ============================================================
   DRAWING → SOURCE
   ============================================================ */

function drawingSourceImageToDrawing() {

    if (!drawCanvas)
        return;

    const c =
        document.createElement("canvas");

    c.width =
        512;

    c.height =
        512;

    const x =
        c.getContext("2d", {
            willReadFrequently: true
        });

    const size =
        Math.min(
            innerWidth,
            innerHeight
        ) * .86;

    const left =
        (innerWidth - size) / 2;

    const top =
        (innerHeight - size) / 2;

    /*
     * Copy only the image area.
     * The surrounding UI/background is not
     * allowed to become part of the source.
     */

    x.fillStyle =
        "#404040";

    x.fillRect(
        0,
        0,
        512,
        512
    );

    x.imageSmoothingEnabled =
        true;

    x.drawImage(
        drawCanvas,
        left,
        top,
        size,
        size,
        0,
        0,
        512,
        512
    );

    sourceCanvas =
        c;

    sourceImage =
        null;

    updatePreview(
        sourceCanvas,
        sourcePreview
    );

    particles =
        [];

    progress =
        0;

    setProgress(
        0
    );

    draw();

    drawingDirty =
        false;
}


/* ============================================================
   REALTIME DRAWING SOURCE UPDATE
   ============================================================ */

function queueRealtimeSourceUpdate() {

    if (drawingRebuildQueued)
        return;

    drawingRebuildQueued =
        true;

    requestAnimationFrame(
        () => {

            drawingRebuildQueued =
                false;

            if (!drawingDirty)
                return;

            drawingSourceImageToDrawing();

            /*
             * If an animation is currently running,
             * rebuild the particle mapping from the
             * new drawing and keep the current progress.
             */

            if (
                playing &&
                targetCanvas
            ) {

                buildPixels();

                draw(progress);
            }
        }
    );
}


/* ============================================================
   COLOR DISTANCE
   ============================================================ */

function colorDistance(
    r1,
    g1,
    b1,
    r2,
    g2,
    b2
) {

    const dr =
        r1 - r2;

    const dg =
        g1 - g2;

    const db =
        b1 - b2;

    return (
        dr * dr +
        dg * dg +
        db * db
    );
}


/* ============================================================
   PIXEL BUILD
   ============================================================ */

function buildPixels() {

    if (
        !sourceCanvas ||
        !targetCanvas
    )
        return;

    const requested =
        Number(
            resolutionInput.value
        );

    const resolution =
        Math.max(
            8,
            Math.min(
                160,
                Number.isFinite(requested)
                    ? Math.floor(requested)
                    : 64
            )
        );

    resolutionInput.value =
        resolution;

    const sourceData =
        sourceCanvas
            .getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            )
            .getImageData(
                0,
                0,
                512,
                512
            )
            .data;

    const targetData =
        targetCanvas
            .getContext(
                "2d",
                {
                    willReadFrequently: true
                }
            )
            .getImageData(
                0,
                0,
                512,
                512
            )
            .data;

    const step =
        512 / resolution;

    const total =
        resolution *
        resolution;

    const source =
        new Array(total);

    const target =
        new Array(total);


    /*
     * Read all pixels once.
     */

    let index =
        0;

    for (
        let y = 0;
        y < resolution;
        y++
    ) {

        for (
            let x = 0;
            x < resolution;
            x++
        ) {

            const px =
                Math.min(
                    511,
                    Math.floor(
                        (x + .5) *
                        step
                    )
                );

            const py =
                Math.min(
                    511,
                    Math.floor(
                        (y + .5) *
                        step
                    )
                );

            const dataIndex =
                (
                    py * 512 +
                    px
                ) * 4;

            const r =
                sourceData[dataIndex];

            const g =
                sourceData[
                    dataIndex + 1
                ];

            const b =
                sourceData[
                    dataIndex + 2
                ];

            source[index] = {

                x:
                    x + .5,

                y:
                    y + .5,

                r,
                g,
                b,

                brightness:
                    (
                        r +
                        g +
                        b
                    ) / 3,

                index
            };

            const tr =
                targetData[dataIndex];

            const tg =
                targetData[
                    dataIndex + 1
                ];

            const tb =
                targetData[
                    dataIndex + 2
                ];

            target[index] = {

                x:
                    x + .5,

                y:
                    y + .5,

                r: tr,
                g: tg,
                b: tb,

                brightness:
                    (
                        tr +
                        tg +
                        tb
                    ) / 3,

                index,

                used: false
            };

            index++;
        }
    }


    /*
     * Brightness sorting gives the same general
     * pixel-to-pixel structure without doing an
     * expensive full N² matching operation.
     */

    source.sort(
        (a, b) =>
            a.brightness -
            b.brightness
    );

    target.sort(
        (a, b) =>
            a.brightness -
            b.brightness
    );


    const proximity =
        Math.max(
            0,
            Math.min(
                1,
                Number(
                    proximityInput.value
                ) || 0
            )
        );


    /*
     * Number of local swaps/refinements.
     *
     * Fast mode intentionally performs very little
     * work because this function can be called while
     * drawing.
     */

    const iterations =
        algorithmInput.value === "fast"
            ? 1
            : 4;


    /*
     * Initial brightness assignment.
     */

    const assignments =
        new Array(total);

    for (
        let i = 0;
        i < total;
        i++
    ) {

        assignments[
            source[i].index
        ] =
            target[i];
    }


    /*
     * Local refinement.
     *
     * Instead of searching every target pixel,
     * only inspect a small neighborhood around
     * the brightness-matched position.
     */

    const windowSize =
        algorithmInput.value === "fast"
            ? 5
            : 14;


    for (
        let pass = 0;
        pass < iterations;
        pass++
    ) {

        for (
            let i = 0;
            i < total;
            i++
        ) {

            const p =
                source[i];

            const current =
                assignments[
                    p.index
                ];

            const center =
                Math.round(
                    (
                        current.index
                    )
                );

            let best =
                current;

            let bestScore =
                Infinity;

            const start =
                Math.max(
                    0,
                    center -
                    windowSize
                );

            const end =
                Math.min(
                    total - 1,
                    center +
                    windowSize
                );

            for (
                let j = start;
                j <= end;
                j++
            ) {

                const q =
                    target[j];

                const color =
                    colorDistance(
                        p.r,
                        p.g,
                        p.b,
                        q.r,
                        q.g,
                        q.b
                    );

                const dx =
                    p.x -
                    q.x;

                const dy =
                    p.y -
                    q.y;

                const spatial =
                    dx * dx +
                    dy * dy;

                const score =
                    color +
                    spatial *
                    proximity *
                    100;

                if (
                    score <
                    bestScore
                ) {

                    bestScore =
                        score;

                    best =
                        q;
                }
            }

            assignments[
                p.index
            ] =
                best;
        }
    }


    /*
     * Resolve duplicate destinations cheaply.
     */

    const used =
        new Uint8Array(total);

    const result =
        new Array(total);


    for (
        let i = 0;
        i < total;
        i++
    ) {

        const p =
            source[i];

        let destination =
            assignments[
                p.index
            ];

        if (
            used[
                destination.index
            ]
        ) {

            /*
             * Search outward from the current
             * brightness position.
             */

            let replacement =
                null;

            const center =
                destination.index;

            for (
                let radius = 1;
                radius < total;
                radius++
            ) {

                const left =
                    center - radius;

                const right =
                    center + radius;

                if (
                    left >= 0 &&
                    !used[
                        target[left].index
                    ]
                ) {

                    replacement =
                        target[left];

                    break;
                }

                if (
                    right < total &&
                    !used[
                        target[right].index
                    ]
                ) {

                    replacement =
                        target[right];

                    break;
                }
            }

            if (replacement)
                destination =
                    replacement;
        }

        used[
            destination.index
        ] = 1;

        result[i] = {

            ox:
                p.x,

            oy:
                p.y,

            tx:
                destination.x,

            ty:
                destination.y,

            /*
             * SOURCE COLOR ONLY.
             *
             * Target colors never get drawn.
             */

            r:
                p.r,

            g:
                p.g,

            b:
                p.b
        };
    }

    particles =
        result;

    setProgress(
        0
    );
}


/* ============================================================
   EASING
   ============================================================ */

function ease(t) {

    return t < .5
        ? 4 * t * t * t
        : 1 -
          Math.pow(
              -2 * t + 2,
              3
          ) / 2;
}


/* ============================================================
   PROGRESS
   ============================================================ */

function setProgress(value) {

    const percentage =
        Math.max(
            0,
            Math.min(
                100,
                value * 100
            )
        );

    progressBar.style.width =
        percentage + "%";
}


/* ============================================================
   DRAW
   ============================================================ */

function draw(
    animationProgress = progress
) {

    const width =
        innerWidth;

    const height =
        innerHeight;

    ctx.fillStyle =
        "#404040";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );

    if (!sourceCanvas)
        return;

    const size =
        Math.min(
            width,
            height
        ) * .86;

    const left =
        (width - size) / 2;

    const top =
        (height - size) / 2;


    if (!particles.length) {

        ctx.imageSmoothingEnabled =
            true;

        ctx.drawImage(
            sourceCanvas,
            left,
            top,
            size,
            size
        );

        return;
    }


    const resolution =
        Math.max(
            8,
            Math.min(
                160,
                Number(
                    resolutionInput.value
                ) || 64
            )
        );

    const cell =
        size /
        resolution;

    const p =
        Math.max(
            0,
            Math.min(
                1,
                animationProgress
            )
        );

    const e =
        ease(p);


    /*
     * Draw source pixels.
     *
     * RGB is completely fixed.
     * ONLY X/Y changes.
     */

    for (
        let i = 0;
        i < particles.length;
        i++
    ) {

        const particle =
            particles[i];

        const x =
            particle.ox +
            (
                particle.tx -
                particle.ox
            ) * e;

        const y =
            particle.oy +
            (
                particle.ty -
                particle.oy
            ) * e;

        ctx.fillStyle =
            `rgb(${particle.r},${particle.g},${particle.b})`;

        ctx.fillRect(
            left +
            x * cell,

            top +
            y * cell,

            cell + .75,
            cell + .75
        );
    }
}


/* ============================================================
   ANIMATION
   ============================================================ */

function animationLoop(time) {

    if (!playing)
        return;

    const duration =
        5000;

    progress =
        Math.min(
            1,
            (
                time -
                animationStart
            ) / duration
        );

    draw(
        progress
    );

    setProgress(
        progress
    );

    if (
        progress >= 1
    ) {

        playing =
            false;

        animationFrame =
            null;

        document
            .getElementById("play")
            .textContent =
                "▶";

        setProgress(
            1
        );

        return;
    }

    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}


function startAnimation() {

    if (
        !sourceCanvas ||
        !targetCanvas
    )
        return;

    if (!particles.length)
        buildPixels();

    if (animationFrame)
        cancelAnimationFrame(
            animationFrame
        );

    progress =
        0;

    setProgress(
        0
    );

    playing =
        true;

    animationStart =
        performance.now();

    document
        .getElementById("play")
        .textContent =
            "Ⅱ";

    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}


function reset() {

    playing =
        false;

    if (animationFrame)
        cancelAnimationFrame(
            animationFrame
        );

    animationFrame =
        null;

    progress =
        0;

    setProgress(
        0
    );

    document
        .getElementById("play")
        .textContent =
            "▶";

    particles =
        [];

    draw();
}

                        startAnimation();

function openCrop(mode) {

    cropMode =
        mode;

    cropImage =
        mode === "source"
            ? sourceImage
            : targetImage;

    if (
        !cropImage &&
        mode === "source"
    )
        cropImage =
            sourceCanvas;

    if (
        !cropImage &&
        mode === "target"
    )
        cropImage =
            targetCanvas;

    if (!cropImage)
        return;

    document
        .getElementById("cropX")
        .value =
        50;

    document
        .getElementById("cropY")
        .value =
        50;

    document
        .getElementById("cropZoom")
        .value =
        1;

    cropOverlay
        .classList
        .add("open");

    updateCropPreview();
}


function updateCropPreview() {

    if (!cropImage)
        return;

    const x =
        Number(
            document
                .getElementById("cropX")
                .value
        ) / 100;

    const y =
        Number(
            document
                .getElementById("cropY")
                .value
        ) / 100;

    const zoom =
        Number(
            document
                .getElementById("cropZoom")
                .value
        );

    const image =
        makeSquare(
            cropImage,
            x,
            y,
            zoom
        );

    cropCanvas.width =
        512;

    cropCanvas.height =
        512;

    cropCtx.clearRect(
        0,
        0,
        512,
        512
    );

    cropCtx.drawImage(
        image,
        0,
        0
    );
}

   ============================================================ */

document
    .getElementById("save")
    .addEventListener(
        "click",
        async () => {

            if (!particles.length)
                buildPixels();

            if (
                !canvas.captureStream ||
                !window.MediaRecorder
            ) {

                alert(
                    "Animation export is not supported by this browser."
                );

                return;
            }

            const stream =
                canvas.captureStream(
                    30
                );

            let mime =
                "video/webm";

            if (
                MediaRecorder.isTypeSupported(
                    "video/webm;codecs=vp9"
                )
            ) {

                mime =
                    "video/webm;codecs=vp9";
            }

            const recorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType:
                            mime
                    }
                );

            const chunks =
                [];

            recorder.ondataavailable =
                event => {

                    if (
                        event.data.size
                    ) {

                        chunks.push(
                            event.data
                        );
                    }
                };

            recorder.onstop =
                () => {

                    const blob =
                        new Blob(
                            chunks,
                            {
                                type:
                                    mime
                            }
                        );

                    const url =
                        URL.createObjectURL(
                            blob
                        );

                    const a =
                        document.createElement(
                            "a"
                        );

                    a.href =
                        url;

                    a.download =
                        "obamify.webm";

                    document.body.appendChild(
                        a
                    );

                    a.click();

                    a.remove();

                    setTimeout(
                        () =>
                            URL.revokeObjectURL(
                                url
                            ),
                        1000
                    );
                };

            recorder.start();

            const start =
                performance.now();

            function record(time) {

                const p =
                    Math.min(
                        1,
                        (
                            time -
                            start
                        ) / 5000
                    );

                draw(p);

                setProgress(
                    p
                );

                if (
                    p < 1
                ) {

                    requestAnimationFrame(
                        record
                    );

                } else {

                    setTimeout(
                        () =>
                            recorder.stop(),
                        100
                    );
                }
            }

            requestAnimationFrame(
                record
            );
        }
    );


/* ============================================================
   INITIALIZATION
   ============================================================ */

async function init() {

    sourceCanvas =
        createDefaultSource();

    sourcePreview.src =
        sourceCanvas.toDataURL();

    try {

        targetImage =
            await loadURL(
                "https://raw.githubusercontent.com/Spu7Nix/obamify/main/assets/obama.png"
            );

        targetCanvas =
            makeSquare(
                targetImage
            );

    } catch {

        targetCanvas =
            createFallbackObama();
    }

    targetPreview.src =
        targetCanvas.toDataURL();

    resizeCanvas();
}

init();

</script>
