<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Obamify</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #404040;
    color: #eee;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
}


/* ============================================================
   CONTROLS
   ============================================================ */

#controls {
    position: fixed;
    z-index: 20;

    top: 8px;
    left: 50%;
    transform: translateX(-50%);

    width: min(760px, calc(100vw - 16px));

    padding: 6px;

    background: rgba(48, 48, 48, .96);

    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 4px;

    box-shadow:
        0 2px 8px rgba(0, 0, 0, .45),
        0 8px 24px rgba(0, 0, 0, .2);

    font-size: 13px;

    user-select: none;
    -webkit-user-select: none;
}

.row {
    display: flex;
    align-items: center;
    gap: 6px;

    min-height: 30px;
}

.row + .row {
    margin-top: 5px;
}

button,
select,
input {
    font: inherit;
}

button,
select {
    color: #eee;
    background: #555;

    border: 1px solid #707070;
    border-radius: 3px;
}

button {
    min-height: 27px;
    padding: 3px 9px;

    cursor: pointer;
}

button:hover {
    background: #626262;
}

button:active {
    background: #444;
}

button:disabled {
    opacity: .5;
    cursor: default;
}

button.active {
    background: #777;
}

select {
    min-height: 27px;
    padding: 2px 7px;
}

input[type="number"] {
    width: 65px;
    min-height: 27px;

    padding: 3px 6px;

    color: white;
    background: #444;

    border: 1px solid #707070;
    border-radius: 3px;
}

input[type="range"] {
    width: 130px;
    accent-color: #aaa;
}

.spacer {
    flex: 1;
}

.label {
    color: #ccc;
    white-space: nowrap;
}

.value {
    width: 38px;
    text-align: right;

    color: #aaa;

    font-variant-numeric: tabular-nums;
}


/* ============================================================
   IMAGE BUTTONS
   ============================================================ */

.image-button {
    display: flex;
    align-items: center;
    gap: 6px;
}

.image-button img {
    width: 27px;
    height: 27px;

    object-fit: cover;

    border-radius: 2px;
    background: #222;
}


/* ============================================================
   ADVANCED
   ============================================================ */

#advanced {
    display: none;

    margin-top: 5px;
    padding-top: 5px;

    border-top: 1px solid rgba(255,255,255,.08);
}

#advanced.open {
    display: block;
}

#advanced .row {
    justify-content: flex-start;
}


/* ============================================================
   DRAWING
   ============================================================ */

#drawControls {
    display: none;
    align-items: center;
    gap: 6px;
}

#drawControls.open {
    display: flex;
}

#brushSize {
    width: 90px !important;
}

#drawCursor {
    position: fixed;
    z-index: 150;

    width: 8px;
    height: 8px;

    pointer-events: none;

    border: 1px solid white;
    border-radius: 50%;

    transform: translate(-50%, -50%);

    display: none;

    box-shadow:
        0 0 0 1px black;
}


/* ============================================================
   CROP
   ============================================================ */

#cropOverlay {
    position: fixed;
    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.75);
}

#cropOverlay.open {
    display: flex;
}

#cropBox {
    width: min(700px, calc(100vw - 24px));

    padding: 12px;

    background: #3e3e3e;

    border: 1px solid #777;
    border-radius: 5px;

    box-shadow:
        0 10px 50px rgba(0,0,0,.6);
}

#cropTitle {
    margin-bottom: 10px;

    font-weight: 600;
}

#cropPreview {
    width: 100%;
    height: min(55vh, 500px);

    display: flex;
    align-items: center;
    justify-content: center;

    background: #222;

    overflow: hidden;
}

#cropCanvas {
    max-width: 100%;
    max-height: 100%;
}

.crop-row {
    display: flex;
    align-items: center;

    gap: 8px;

    margin-top: 9px;
}

.crop-row span {
    width: 80px;
}

.crop-row input {
    flex: 1;
}

.crop-actions {
    display: flex;
    justify-content: flex-end;

    gap: 6px;

    margin-top: 10px;
}


/* ============================================================
   LINKS
   ============================================================ */

#links {
    position: fixed;
    z-index: 20;

    left: 18px;
    bottom: 18px;

    display: flex;
    flex-direction: column;

    gap: 10px;
}

.link {
    width: 45px;
    height: 45px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #000;

    border-radius: 8px;

    text-decoration: none;

    transition:
        transform .15s;
}

.link:hover {
    transform: scale(1.08);
}

.link svg {
    width: 29px;
    height: 29px;

    fill: white;
}


/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 600px) {

    #controls {
        top: 4px;

        width: calc(100vw - 8px);

        font-size: 12px;
    }

    .row {
        flex-wrap: wrap;
    }

    input[type="range"] {
        width: 105px;
    }

    #links {
        left: 12px;
        bottom: 12px;
    }
}
</style>

<script>
"use strict";


/* ============================================================
   ELEMENTS
   ============================================================ */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");


const sourceFile =
    document.getElementById("sourceFile");

const targetFile =
    document.getElementById("targetFile");


const sourcePreview =
    document.getElementById("sourcePreview");

const targetPreview =
    document.getElementById("targetPreview");


const resolutionInput =
    document.getElementById("resolution");

const proximityInput =
    document.getElementById("proximity");

const proximityValue =
    document.getElementById("proximityValue");

const algorithmInput =
    document.getElementById("algorithm");


const drawModeButton =
    document.getElementById("drawMode");

const drawControls =
    document.getElementById("drawControls");

const brushSizeInput =
    document.getElementById("brushSize");

const brushSizeValue =
    document.getElementById("brushSizeValue");


/* ============================================================
   STATE
   ============================================================ */

let sourceImage = null;
let targetImage = null;

let sourceCanvas = null;
let targetCanvas = null;

let particles = [];

let playing = false;

let progress = 0;

let animationStart = 0;

let animationFrame = null;

let cropMode = null;

let cropImage = null;


/* ============================================================
   REALTIME DRAWING STATE
   ============================================================ */

let drawingMode = false;

let drawingPointerDown = false;

let lastDrawX = null;
let lastDrawY = null;

const drawCursor =
    document.createElement("div");

drawCursor.id =
    "drawCursor";

document.body.appendChild(
    drawCursor
);


/* ============================================================
   DEFAULT SOURCE
   ============================================================ */

function createDefaultSource() {

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 512;

    const x =
        c.getContext("2d");

    const gradient =
        x.createLinearGradient(
            0,
            0,
            512,
            512
        );

    gradient.addColorStop(
        0,
        "#888"
    );

    gradient.addColorStop(
        1,
        "#222"
    );

    x.fillStyle =
        gradient;

    x.fillRect(
        0,
        0,
        512,
        512
    );

    return c;
}


/* ============================================================
   FALLBACK TARGET
   ============================================================ */

function createFallbackObama() {

    const c =
        document.createElement("canvas");

    c.width = 512;
    c.height = 512;

    const x =
        c.getContext("2d");

    x.fillStyle =
        "#27354b";

    x.fillRect(
        0,
        0,
        512,
        512
    );


    x.fillStyle =
        "#c9946b";

    x.beginPath();

    x.ellipse(
        256,
        240,
        105,
        130,
        0,
        0,
        Math.PI * 2
    );

    x.fill();


    x.fillStyle =
        "#17120f";

    x.beginPath();

    x.ellipse(
        256,
        145,
        108,
        65,
        Math.PI,
        0,
        Math.PI * 2
    );

    x.fill();


    x.fillStyle =
        "#111";

    x.beginPath();

    x.ellipse(
        215,
        240,
        13,
        8,
        0,
        0,
        Math.PI * 2
    );

    x.ellipse(
        297,
        240,
        13,
        8,
        0,
        0,
        Math.PI * 2
    );

    x.fill();


    x.strokeStyle =
        "#633c2c";

    x.lineWidth =
        5;

    x.beginPath();

    x.arc(
        256,
        275,
        43,
        .2,
        Math.PI - .2
    );

    x.stroke();


    x.fillStyle =
        "#111";

    x.beginPath();

    x.moveTo(150, 355);
    x.lineTo(362, 355);
    x.lineTo(430, 512);
    x.lineTo(82, 512);

    x.closePath();

    x.fill();


    return c;
}


/* ============================================================
   IMAGE LOADING
   ============================================================ */

function loadFile(file) {

    return new Promise(
        (resolve, reject) => {

            if (
                !file ||
                !file.type.startsWith("image/")
            ) {

                reject(
                    new Error(
                        "Invalid image"
                    )
                );

                return;
            }

            const url =
                URL.createObjectURL(file);

            const img =
                new Image();

            img.onload = () => {

                URL.revokeObjectURL(
                    url
                );

                resolve(img);
            };

            img.onerror = () => {

                URL.revokeObjectURL(
                    url
                );

                reject(
                    new Error(
                        "Could not load image"
                    )
                );
            };

            img.src = url;
        }
    );
}


function loadURL(url) {

    return new Promise(
        (resolve, reject) => {

            const img =
                new Image();

            img.crossOrigin =
                "anonymous";

            img.onload = () =>
                resolve(img);

            img.onerror = () =>
                reject(
                    new Error(
                        "Could not load image"
                    )
                );

            img.src =
                url;
        }
    );
}


/* ============================================================
   SQUARE CROP
   ============================================================ */

function makeSquare(
    img,
    offsetX = .5,
    offsetY = .5,
    zoom = 1
) {

    const width =
        img.naturalWidth ||
        img.width;

    const height =
        img.naturalHeight ||
        img.height;

    const side =
        Math.min(
            width,
            height
        );

    const visible =
        side / zoom;

    const maxX =
        width - visible;

    const maxY =
        height - visible;

    const sx =
        maxX * offsetX;

    const sy =
        maxY * offsetY;


    const c =
        document.createElement("canvas");

    c.width =
        512;

    c.height =
        512;


    const x =
        c.getContext("2d");

    x.imageSmoothingEnabled =
        true;


    x.drawImage(
        img,

        sx,
        sy,

        visible,
        visible,

        0,
        0,

        512,
        512
    );


    return c;
}


/* ============================================================
   PREVIEW
   ============================================================ */

function updatePreview(
    canvasElement,
    previewElement
) {

    previewElement.src =
        canvasElement.toDataURL(
            "image/jpeg",
            .85
        );
}


/* ============================================================
   RESIZE
   ============================================================ */

function resizeCanvas() {

    const dpr =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        Math.round(
            innerWidth * dpr
        );

    canvas.height =
        Math.round(
            innerHeight * dpr
        );

    canvas.style.width =
        innerWidth + "px";

    canvas.style.height =
        innerHeight + "px";


    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    draw();
}

window.addEventListener(
    "resize",
    resizeCanvas,
    {
        passive: true
    }
);


/* ============================================================
   COLOR DISTANCE
   ============================================================ */

function colorDistance(a, b) {

    const dr =
        a.r - b.r;

    const dg =
        a.g - b.g;

    const db =
        a.b - b.b;


    return (
        dr * dr +
        dg * dg +
        db * db
    );
}


/* ============================================================
   BUILD PIXELS
   ============================================================ */

function buildPixels() {

    const requested =
        Number(
            resolutionInput.value
        );


    const resolution =
        Math.max(
            8,
            Math.min(
                160,
                Number.isFinite(requested)
                    ? Math.floor(requested)
                    : 64
            )
        );


    resolutionInput.value =
        resolution;


    const sourceData =
        sourceCanvas
            .getContext("2d")
            .getImageData(
                0,
                0,
                512,
                512
            ).data;


    const targetData =
        targetCanvas
            .getContext("2d")
            .getImageData(
                0,
                0,
                512,
                512
            ).data;


    const step =
        512 / resolution;


    const source = [];
    const target = [];


    for (
        let y = 0;
        y < resolution;
        y++
    ) {

        for (
            let x = 0;
            x < resolution;
            x++
        ) {

            const px =
                Math.min(
                    511,
                    Math.floor(
                        (x + .5) * step
                    )
                );

            const py =
                Math.min(
                    511,
                    Math.floor(
                        (y + .5) * step
                    )
                );


            const index =
                (
                    py * 512 +
                    px
                ) * 4;


            source.push({

                x: x + .5,
                y: y + .5,

                r:
                    sourceData[index],

                g:
                    sourceData[index + 1],

                b:
                    sourceData[index + 2]
            });


            target.push({

                x: x + .5,
                y: y + .5,

                r:
                    targetData[index],

                g:
                    targetData[index + 1],

                b:
                    targetData[index + 2]
            });
        }
    }


    const proximity =
        Number(
            proximityInput.value
        );


    const sortedSource =
        source
            .map(
                (pixel, index) => ({
                    pixel,
                    index,

                    brightness:
                        (
                            pixel.r +
                            pixel.g +
                            pixel.b
                        ) / 3
                })
            )
            .sort(
                (a, b) =>
                    a.brightness -
                    b.brightness
            );


    const sortedTarget =
        target
            .map(
                (pixel, index) => ({
                    pixel,
                    index,

                    brightness:
                        (
                            pixel.r +
                            pixel.g +
                            pixel.b
                        ) / 3
                })
            )
            .sort(
                (a, b) =>
                    a.brightness -
                    b.brightness
            );


    const assignments =
        new Array(
            source.length
        );


    for (
        let i = 0;
        i < sortedSource.length;
        i++
    ) {

        assignments[
            sortedSource[i].index
        ] =
            sortedTarget[i].pixel;
    }


    const candidatesPerPixel =
        algorithmInput.value === "fast"
            ? 12
            : Math.min(
                80,
                target.length
            );


    /*
     * Pre-sort target pixels by brightness once.
     *
     * The old implementation rebuilt this
     * candidate list for every source pixel.
     */

    for (
        let i = 0;
        i < source.length;
        i++
    ) {

        const p =
            source[i];


        let best =
            assignments[i];

        let bestScore =
            Infinity;


        const targetBrightness =
            (
                p.r +
                p.g +
                p.b
            ) / 3;


        /*
         * Find the closest brightness candidates.
         */

        const nearby =
            target
                .map(
                    q => ({
                        q,

                        difference:
                            Math.abs(
                                (
                                    q.r +
                                    q.g +
                                    q.b
                                ) / 3 -
                                targetBrightness
                            )
                    })
                )
                .sort(
                    (a, b) =>
                        a.difference -
                        b.difference
                )
                .slice(
                    0,
                    candidatesPerPixel
                );


        for (
            const entry
            of nearby
        ) {

            const q =
                entry.q;


            const distance =
                colorDistance(
                    p,
                    q
                );


            const dx =
                p.x - q.x;

            const dy =
                p.y - q.y;


            const spatial =
                dx * dx +
                dy * dy;


            const score =
                distance +
                spatial *
                proximity *
                80;


            if (
                score <
                bestScore
            ) {

                bestScore =
                    score;

                best =
                    q;
            }
        }


        assignments[i] =
            best;
    }


    /*
     * Resolve duplicate destinations.
     */

    const used =
        new Set();

    const result = [];


    for (
        let i = 0;
        i < source.length;
        i++
    ) {

        const p =
            source[i];


        let destination =
            assignments[i];


        let key =
            destination.x +
            ":" +
            destination.y;


        if (
            used.has(key)
        ) {

            let replacement =
                null;

            let replacementScore =
                Infinity;


            for (
                const q
                of target
            ) {

                const qKey =
                    q.x +
                    ":" +
                    q.y;


                if (
                    used.has(qKey)
                )
                    continue;


                const dx =
                    p.x - q.x;

                const dy =
                    p.y - q.y;


                const spatial =
                    dx * dx +
                    dy * dy;


                const score =
                    colorDistance(
                        p,
                        q
                    ) +
                    spatial *
                    proximity *
                    80;


                if (
                    score <
                    replacementScore
                ) {

                    replacementScore =
                        score;

                    replacement =
                        q;
                }
            }


            if (replacement)
                destination =
                    replacement;
        }


        key =
            destination.x +
            ":" +
            destination.y;


        used.add(key);


        result.push({

            ox:
                p.x,

            oy:
                p.y,

            tx:
                destination.x,

            ty:
                destination.y,

            /*
             * SOURCE COLOR IS STORED.
             *
             * TARGET COLOR IS NEVER USED
             * FOR DRAWING.
             */

            r:
                p.r,

            g:
                p.g,

            b:
                p.b
        });
    }


    particles =
        result;
}


/* ============================================================
   EASING
   ============================================================ */

function ease(t) {

    return t < .5
        ? 4 * t * t * t
        : 1 -
          Math.pow(
              -2 * t + 2,
              3
          ) / 2;
}


/* ============================================================
   DRAW
   ============================================================ */

function draw(
    animationProgress = progress
) {

    const width =
        innerWidth;

    const height =
        innerHeight;


    ctx.fillStyle =
        "#404040";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    if (!sourceCanvas)
        return;


    const size =
        Math.min(
            width,
            height
        ) * .86;


    const left =
        (width - size) / 2;

    const top =
        (height - size) / 2;


    if (!particles.length) {

        ctx.imageSmoothingEnabled =
            true;

        ctx.drawImage(
            sourceCanvas,
            left,
            top,
            size,
            size
        );

        return;
    }


    const resolution =
        Math.max(
            8,
            Math.min(
                160,
                Number(
                    resolutionInput.value
                ) || 64
            )
        );


    const cell =
        size / resolution;


    const e =
        ease(
            Math.max(
                0,
                Math.min(
                    1,
                    animationProgress
                )
            )
        );


    ctx.imageSmoothingEnabled =
        false;


    for (
        const particle
        of particles
    ) {

        const x =
            particle.ox +
            (
                particle.tx -
                particle.ox
            ) * e;


        const y =
            particle.oy +
            (
                particle.ty -
                particle.oy
            ) * e;


        /*
         * ONLY THE ORIGINAL SOURCE COLOR
         * IS EVER DRAWN.
         */

        ctx.fillStyle =
            `rgb(
                ${particle.r},
                ${particle.g},
                ${particle.b}
            )`;


        ctx.fillRect(
            left +
            x * cell,

            top +
            y * cell,

            cell + 1,
            cell + 1
        );
    }
}


/* ============================================================
   ANIMATION
   ============================================================ */

function animationLoop(time) {

    if (!playing)
        return;


    const duration =
        5000;


    progress =
        Math.min(
            1,
            (
                time -
                animationStart
            ) / duration
        );


    draw(progress);


    if (
        progress >= 1
    ) {

        playing =
            false;

        document
            .getElementById("play")
            .textContent =
                "▶";

        animationFrame =
            null;

        return;
    }


    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}


function startAnimation() {

    if (!particles.length)
        buildPixels();


    if (animationFrame)
        cancelAnimationFrame(
            animationFrame
        );


    progress =
        0;

    playing =
        true;


    animationStart =
        performance.now();


    document
        .getElementById("play")
        .textContent =
            "Ⅱ";


    animationFrame =
        requestAnimationFrame(
            animationLoop
        );
}


function reset() {

    playing =
        false;


    if (animationFrame)
        cancelAnimationFrame(
            animationFrame
        );


    animationFrame =
        null;

    progress =
        0;


    document
        .getElementById("play")
        .textContent =
            "▶";


    draw();
}


/* ============================================================
   REALTIME DRAWING
   ============================================================ */

function screenToImage(
    screenX,
    screenY
) {

    const width =
        innerWidth;

    const height =
        innerHeight;


    const size =
        Math.min(
            width,
            height
        ) * .86;


    const left =
        (width - size) / 2;

    const top =
        (height - size) / 2;


    return {

        x:
            (
                screenX -
                left
            ) / size * 512,

        y:
            (
                screenY -
                top
            ) / size * 512
    };
}


/*
 * Returns whether the pointer is actually
 * inside the displayed 512x512 image.
 */

function isInsideImage(
    x,
    y
) {

    const p =
        screenToImage(
            x,
            y
        );


    return (
        p.x >= 0 &&
        p.x <= 512 &&
        p.y >= 0 &&
        p.y <= 512
    );
}


/*
 * Draw a single point.
 *
 * The brush is intentionally small:
 *
 * 1 = one source pixel
 * 4 = four-pixel brush
 * etc.
 */

function drawPoint(
    screenX,
    screenY
) {

    if (!sourceCanvas)
        return;


    const point =
        screenToImage(
            screenX,
            screenY
        );


    if (
        point.x < 0 ||
        point.x >= 512 ||
        point.y < 0 ||
        point.y >= 512
    )
        return;


    const brush =
        Math.max(
            1,
            Number(
                brushSizeInput.value
            ) || 4
        );


    const sourceCtx =
        sourceCanvas.getContext(
            "2d"
        );


    /*
     * Draw using the actual source canvas.
     *
     * White is deliberately used as the brush
     * color. This is a drawing editor for the
     * source image, not an animation colorizer.
     */

    sourceCtx.fillStyle =
        "#ffffff";

    sourceCtx.fillRect(
        Math.floor(
            point.x -
            brush / 2
        ),
        Math.floor(
            point.y -
            brush / 2
        ),
        brush,
        brush
    );


    /*
     * The generated particle map becomes
     * invalid immediately after a source edit.
     */

    particles = [];

    progress = 0;


    /*
     * Show the edited source immediately.
     */

    draw();


    sourcePreview.src =
        sourceCanvas.toDataURL(
            "image/jpeg",
            .85
        );
}


/*
 * Draw a line with no gaps.
 *
 * Pointer events can jump several pixels between
 * frames, especially on mobile. Interpolating the
 * points makes drawing continuous.
 */

function drawLine(
    x1,
    y1,
    x2,
    y2
) {

    if (!sourceCanvas)
        return;


    const a =
        screenToImage(
            x1,
            y1
        );

    const b =
        screenToImage(
            x2,
            y2
        );


    const brush =
        Math.max(
            1,
            Number(
                brushSizeInput.value
            ) || 4
        );


    const sourceCtx =
        sourceCanvas.getContext(
            "2d"
        );


    sourceCtx.fillStyle =
        "#ffffff";


    const dx =
        b.x - a.x;

    const dy =
        b.y - a.y;


    const distance =
        Math.hypot(
            dx,
            dy
        );


    /*
     * One point approximately every half brush
     * width prevents holes in fast strokes.
     */

    const steps =
        Math.max(
            1,
            Math.ceil(
                distance /
                Math.max(
                    .5,
                    brush * .5
                )
            )
        );


    for (
        let i = 0;
        i <= steps;
        i++
    ) {

        const t =
            i / steps;


        const x =
            a.x +
            dx * t;

        const y =
            a.y +
            dy * t;


        sourceCtx.fillRect(
            Math.floor(
                x -
                brush / 2
            ),
            Math.floor(
                y -
                brush / 2
            ),
            brush,
            brush
        );
    }


    particles = [];

    progress = 0;


    /*
     * THIS IS THE REALTIME PART:
     *
     * The canvas is redrawn during the pointermove
     * event itself.
     */

    draw();


    sourcePreview.src =
        sourceCanvas.toDataURL(
            "image/jpeg",
            .85
        );
}


/* ============================================================
   DRAW CURSOR
   ============================================================ */

function updateDrawCursor(
    x,
    y
) {

    if (!drawingMode)
        return;


    const brush =
        Math.max(
            1,
            Number(
                brushSizeInput.value
            ) || 4
        );


    /*
     * Convert source-pixel brush size to
     * screen pixels.
     */

    const size =
        Math.min(
            innerWidth,
            innerHeight
        ) * .86;


    const screenBrush =
        brush *
        size /
        512;


    drawCursor.style.width =
        Math.max(
            2,
            screenBrush
        ) + "px";

    drawCursor.style.height =
        Math.max(
            2,
            screenBrush
        ) + "px";


    drawCursor.style.left =
        x + "px";

    drawCursor.style.top =
        y + "px";

    drawCursor.style.display =
        "block";
}


/* ============================================================
   DRAW MODE TOGGLE
   ============================================================ */

drawModeButton.addEventListener(
    "click",
    () => {

        drawingMode =
            !drawingMode;


        drawModeButton.classList.toggle(
            "active",
            drawingMode
        );


        drawControls.classList.toggle(
            "open",
            drawingMode
        );


        if (!drawingMode) {

            drawingPointerDown =
                false;

            lastDrawX =
                null;

            lastDrawY =
                null;

            drawCursor.style.display =
                "none";

            canvas.style.cursor =
                "default";

        } else {

            canvas.style.cursor =
                "none";
        }
    }
);


/* ============================================================
   BRUSH SIZE
   ============================================================ */

brushSizeInput.addEventListener(
    "input",
    () => {

        const value =
            Math.max(
                1,
                Math.min(
                    20,
                    Number(
                        brushSizeInput.value
                    ) || 4
                )
            );


        brushSizeInput.value =
            value;


        brushSizeValue.textContent =
            value;


        /*
         * Update cursor size immediately.
         */

        if (
            drawingMode &&
            lastDrawX !== null &&
            lastDrawY !== null
        ) {

            updateDrawCursor(
                lastDrawX,
                lastDrawY
            );
        }
    }
);


/* ============================================================
   POINTER DOWN
   ============================================================ */

canvas.addEventListener(
    "pointerdown",
    event => {

        if (!drawingMode)
            return;


        if (
            !isInsideImage(
                event.clientX,
                event.clientY
            )
        )
            return;


        event.preventDefault();


        drawingPointerDown =
            true;


        lastDrawX =
            event.clientX;

        lastDrawY =
            event.clientY;


        updateDrawCursor(
            event.clientX,
            event.clientY
        );


        /*
         * First point is drawn immediately.
         */

        drawPoint(
            event.clientX,
            event.clientY
        );


        try {

            canvas.setPointerCapture(
                event.pointerId
            );

        } catch {}
    },
    {
        passive: false
    }
);


/* ============================================================
   REALTIME POINTER MOVE
   ============================================================ */

canvas.addEventListener(
    "pointermove",
    event => {

        if (!drawingMode)
            return;


        updateDrawCursor(
            event.clientX,
            event.clientY
        );


        if (!drawingPointerDown)
            return;


        event.preventDefault();


        const x =
            event.clientX;

        const y =
            event.clientY;


        if (
            lastDrawX !== null &&
            lastDrawY !== null
        ) {

            /*
             * DRAW RIGHT NOW.
             *
             * No pointerup.
             * No timeout.
             * No animation frame delay.
             */

            drawLine(
                lastDrawX,
                lastDrawY,
                x,
                y
            );

        } else {

            drawPoint(
                x,
                y
            );
        }


        lastDrawX =
            x;

        lastDrawY =
            y;
    },
    {
        passive: false
    }
);


/* ============================================================
   POINTER UP
   ============================================================ */

function stopDrawing() {

    drawingPointerDown =
        false;

    lastDrawX =
        null;

    lastDrawY =
        null;
}


canvas.addEventListener(
    "pointerup",
    stopDrawing
);

canvas.addEventListener(
    "pointercancel",
    stopDrawing
);

canvas.addEventListener(
    "lostpointercapture",
    stopDrawing
);


/* ============================================================
   DRAW CURSOR EVENTS
   ============================================================ */

canvas.addEventListener(
    "pointerleave",
    () => {

        if (!drawingPointerDown)
            drawCursor.style.display =
                "none";
    }
);

canvas.addEventListener(
    "pointerenter",
    event => {

        if (drawingMode) {

            updateDrawCursor(
                event.clientX,
                event.clientY
            );
        }
    }
);


/* ============================================================
   GENERATE
   ============================================================ */

document
    .getElementById("generate")
    .addEventListener(
        "click",
        async () => {

            const button =
                document.getElementById(
                    "generate"
                );


            button.disabled =
                true;


            await new Promise(
                resolve =>
                    setTimeout(
                        resolve,
                        20
                    )
            );


            try {

                buildPixels();

                startAnimation();

            } catch (error) {

                console.error(
                    error
                );

                alert(
                    "Failed to generate."
                );

            } finally {

                button.disabled =
                    false;
            }
        }
    );


/* ============================================================
   PLAY / PAUSE
   ============================================================ */

document
    .getElementById("play")
    .addEventListener(
        "click",
        () => {

            if (playing) {

                playing =
                    false;


                if (animationFrame)
                    cancelAnimationFrame(
                        animationFrame
                    );


                animationFrame =
                    null;


                document
                    .getElementById(
                        "play"
                    )
                    .textContent =
                        "▶";

            } else {

                startAnimation();
            }
        }
    );


/* ============================================================
   RESET
   ============================================================ */

document
    .getElementById("reset")
    .addEventListener(
        "click",
        reset
    );


/* ============================================================
   SOURCE / TARGET
   ============================================================ */

document
    .getElementById("sourceButton")
    .addEventListener(
        "click",
        () =>
            sourceFile.click()
    );


document
    .getElementById("targetButton")
    .addEventListener(
        "click",
        () =>
            targetFile.click()
    );


sourceFile.addEventListener(
    "change",
    async () => {

        const file =
            sourceFile.files[0];

        if (!file)
            return;


        try {

            sourceImage =
                await loadFile(
                    file
                );


            sourceCanvas =
                makeSquare(
                    sourceImage
                );


            updatePreview(
                sourceCanvas,
                sourcePreview
            );


            particles = [];

            reset();

        } catch (error) {

            console.error(
                error
            );

            alert(
                "Failed to load source image."
            );
        }
    }
);


targetFile.addEventListener(
    "change",
    async () => {

        const file =
            targetFile.files[0];

        if (!file)
            return;


        try {

            targetImage =
                await loadFile(
                    file
                );


            targetCanvas =
                makeSquare(
                    targetImage
                );


            updatePreview(
                targetCanvas,
                targetPreview
            );


            particles = [];

            reset();

        } catch (error) {

            console.error(
                error
            );

            alert(
                "Failed to load target image."
            );
        }
    }
);


/* ============================================================
   CROP
   ============================================================ */

const cropOverlay =
    document.getElementById(
        "cropOverlay"
    );

const cropCanvas =
    document.getElementById(
        "cropCanvas"
    );

const cropCtx =
    cropCanvas.getContext(
        "2d"
    );


function openCrop(mode) {

    cropMode =
        mode;


    cropImage =
        mode === "source"
            ? sourceImage
            : targetImage;


    if (
        !cropImage &&
        mode === "source"
    ) {

        cropImage =
            sourceCanvas;
    }


    if (
        !cropImage &&
        mode === "target"
    ) {

        cropImage =
            targetCanvas;
    }


    if (!cropImage)
        return;


    document
        .getElementById("cropX")
        .value = 50;


    document
        .getElementById("cropY")
        .value = 50;


    document
        .getElementById("cropZoom")
        .value = 1;


    cropOverlay
        .classList
        .add("open");


    updateCropPreview();
}


function updateCropPreview() {

    if (!cropImage)
        return;


    const x =
        Number(
            document
                .getElementById("cropX")
                .value
        ) / 100;


    const y =
        Number(
            document
                .getElementById("cropY")
                .value
        ) / 100;


    const zoom =
        Number(
            document
                .getElementById("cropZoom")
                .value
        );


    const image =
        makeSquare(
            cropImage,
            x,
            y,
            zoom
        );


    cropCanvas.width =
        512;

    cropCanvas.height =
        512;


    cropCtx.clearRect(
        0,
        0,
        512,
        512
    );


    cropCtx.drawImage(
        image,
        0,
        0
    );
}


document
    .getElementById("sourceCrop")
    .addEventListener(
        "click",
        () =>
            openCrop("source")
    );


document
    .getElementById("targetCrop")
    .addEventListener(
        "click",
        () =>
            openCrop("target")
    );


for (
    const id
    of [
        "cropX",
        "cropY",
        "cropZoom"
    ]
) {

    document
        .getElementById(id)
        .addEventListener(
            "input",
            updateCropPreview
        );
}


document
    .getElementById("cropCancel")
    .addEventListener(
        "click",
        () => {

            cropOverlay
                .classList
                .remove("open");
        }
    );


document
    .getElementById("cropApply")
    .addEventListener(
        "click",
        () => {

            if (!cropImage)
                return;


            const x =
                Number(
                    document
                        .getElementById(
                            "cropX"
                        )
                        .value
                ) / 100;


            const y =
                Number(
                    document
                        .getElementById(
                            "cropY"
                        )
                        .value
                ) / 100;


            const zoom =
                Number(
                    document
                        .getElementById(
                            "cropZoom"
                        )
                        .value
                );


            const cropped =
                makeSquare(
                    cropImage,
                    x,
                    y,
                    zoom
                );


            if (
                cropMode ===
                "source"
            ) {

                sourceCanvas =
                    cropped;


                sourcePreview.src =
                    cropped.toDataURL();

            } else {

                targetCanvas =
                    cropped;


                targetPreview.src =
                    cropped.toDataURL();
            }


            particles = [];


            cropOverlay
                .classList
                .remove("open");


            reset();
        }
    );


/* ============================================================
   ADVANCED
   ============================================================ */

document
    .getElementById("advancedButton")
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "advanced"
                )
                .classList
                .toggle("open");
        }
    );


proximityInput.addEventListener(
    "input",
    () => {

        proximityValue.textContent =
            Number(
                proximityInput.value
            ).toFixed(2);
    }
);


resolutionInput.addEventListener(
    "change",
    () => {

        const value =
            Math.max(
                8,
                Math.min(
                    160,
                    Number(
                        resolutionInput.value
                    ) || 64
                )
            );


        resolutionInput.value =
            value;


        particles = [];

        reset();
    }
);


algorithmInput.addEventListener(
    "change",
    () => {

        particles = [];

        reset();
    }
);


/* ============================================================
   SAVE
   ============================================================ */

document
    .getElementById("save")
    .addEventListener(
        "click",
        async () => {

            if (!particles.length)
                buildPixels();


            if (
                !canvas.captureStream ||
                !window.MediaRecorder
            ) {

                alert(
                    "Animation export is not supported by this browser."
                );

                return;
            }


            const stream =
                canvas.captureStream(
                    30
                );


            let mime =
                "video/webm";


            if (
                MediaRecorder
                    .isTypeSupported(
                        "video/webm;codecs=vp9"
                    )
            ) {

                mime =
                    "video/webm;codecs=vp9";
            }


            const recorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType: mime
                    }
                );


            const chunks = [];


            recorder.ondataavailable =
                event => {

                    if (
                        event.data.size
                    ) {

                        chunks.push(
                            event.data
                        );
                    }
                };


            recorder.onstop =
                () => {

                    const blob =
                        new Blob(
                            chunks,
                            {
                                type: mime
                            }
                        );


                    const url =
                        URL.createObjectURL(
                            blob
                        );


                    const a =
                        document.createElement(
                            "a"
                        );


                    a.href =
                        url;

                    a.download =
                        "obamify.webm";


                    document
                        .body
                        .appendChild(a);


                    a.click();

                    a.remove();


                    setTimeout(
                        () =>
                            URL.revokeObjectURL(
                                url
                            ),
                        1000
                    );
                };


            recorder.start();


            const start =
                performance.now();


            function record(time) {

                const p =
                    Math.min(
                        1,
                        (
                            time -
                            start
                        ) / 5000
                    );


                draw(p);


                if (
                    p < 1
                ) {

                    requestAnimationFrame(
                        record
                    );

                } else {

                    setTimeout(
                        () =>
                            recorder.stop(),
                        100
                    );
                }
            }


            requestAnimationFrame(
                record
            );
        }
    );


/* ============================================================
   INITIALIZATION
   ============================================================ */

async function init() {

    sourceCanvas =
        createDefaultSource();


    sourcePreview.src =
        sourceCanvas.toDataURL();


    try {

        targetImage =
            await loadURL(
                "https://raw.githubusercontent.com/Spu7Nix/obamify/main/assets/obama.png"
            );


        targetCanvas =
            makeSquare(
                targetImage
            );

    } catch {

        targetCanvas =
            createFallbackObama();
    }


    targetPreview.src =
        targetCanvas.toDataURL();


    resizeCanvas();
}


init();
